<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boom Bots 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  :root { color-scheme: dark; --bg: #07080d; --ink: #fff4e0; --line: #39425f; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); overflow: hidden;
         font-family: "Press Start 2P", ui-monospace, Consolas, monospace; }
  #c { position: fixed; inset: 0; display: block; outline: none; touch-action: none; }
  .topbar { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); right: 16px; display: flex; gap: 8px; z-index: 2; }
  .topbar button { background: rgba(7, 8, 13, .7); border: 1px solid var(--line); color: #d9dcea; font: inherit;
         font-size: 9px; padding: 7px 9px; border-radius: 3px; cursor: pointer; }
  .topbar button:hover { border-color: #ff8a3d; color: #fff; }
  button:focus-visible { outline: 2px solid #ff8a3d; outline-offset: 2px; }
  .touch { display: none; position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
         justify-content: space-between; align-items: flex-end; padding-inline: 16px; pointer-events: none; z-index: 2; }
  @media (hover: none) and (pointer: coarse) { .touch { display: flex; } }
  .stick { width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(255, 244, 224, .3); background: rgba(255, 244, 224, .06);
         position: relative; pointer-events: auto; touch-action: none; }
  .nub { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%;
         background: rgba(255, 138, 61, .45); border: 2px solid rgba(255, 138, 61, .8); }
  .btns { display: grid; grid-template-columns: repeat(2, auto); gap: 10px; pointer-events: auto; align-items: end; }
  .btns button { width: 60px; height: 60px; border-radius: 50%; border: 2px solid rgba(255, 244, 224, .35); background: rgba(255, 244, 224, .08);
         color: #fff4e0; font: inherit; font-size: 8px; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  .btns button.fire { width: 76px; height: 76px; background: rgba(232, 86, 58, .3); border-color: rgba(232, 86, 58, .8); font-size: 10px; }
  .btns button.on { filter: brightness(1.8); }
</style>

<canvas id="c" tabindex="0" aria-label="Boom Bots 3D game. Press Enter to start."></canvas>
<div class="topbar">
  <button id="pauseBtn" type="button" hidden>Pause</button>
  <button id="soundBtn" type="button">Sound on</button>
</div>
<div class="touch">
  <div class="stick" id="stick"><div class="nub" id="nub"></div></div>
  <div class="btns">
    <button type="button" data-k="map">MAP</button>
    <button type="button" data-k="wpn">WPN</button>
    <button type="button" data-k="use">OPEN</button>
    <button type="button" data-k="fire" class="fire">FIRE</button>
  </div>
</div>

<script>
(() => {
  'use strict';
  const RW = 320, VH = 160, RH = 200, TS = 64, FOV = 0.66, PROJ = RW / (2 * FOV);
  const FONT = '"Press Start 2P", ui-monospace, monospace';
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const buf = document.createElement('canvas'); buf.width = RW; buf.height = RH;
  const b = buf.getContext('2d');
  const view = b.createImageData(RW, VH), pix = new Uint32Array(view.data.buffer), zbuf = new Float32Array(RW);
  const isTouch = matchMedia('(hover: none) and (pointer: coarse)').matches;
  const pauseBtn = document.getElementById('pauseBtn'), soundBtn = document.getElementById('soundBtn');

  let W, H, DPR, S, offX, offY;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); cv.style.width = W + 'px'; cv.style.height = H + 'px';
    S = Math.min(W / RW, H / RH); offX = (W - RW * S) / 2;
    const spare = H - RH * S; offY = spare * (H > W ? 0.15 : 0.5);
  }
  addEventListener('resize', resize); resize();

  function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rnd = mulberry(42);
  const rand = (a, c) => a + Math.random() * (c - a);
  const pack = (r, g, bl) => ((255 << 24) | (bl << 16) | (g << 8) | r) >>> 0;

  // ---------------- textures & sprites (drawn in code, then read back as pixels) ----------------
  const F = (x, c, a, y, w, h) => { x.fillStyle = c; x.fillRect(a, y, w, h); };
  const O = (x, c, cx, cy, r) => { x.fillStyle = c; x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill(); };
  function speckle(x, n, c) { x.fillStyle = c; for (let i = 0; i < n; i++) x.fillRect(rnd() * 64 | 0, rnd() * 64 | 0, 1 + (rnd() * 2 | 0), 1); }
  function makeImg(draw) {
    const c = document.createElement('canvas'); c.width = c.height = TS;
    const x = c.getContext('2d'); draw(x);
    const d = x.getImageData(0, 0, TS, TS).data, px = new Uint32Array(TS * TS), dk = new Uint32Array(TS * TS);
    for (let i = 0; i < TS * TS; i++) {
      const r = d[i * 4], g = d[i * 4 + 1], bl = d[i * 4 + 2], a = d[i * 4 + 3] > 128 ? 255 : 0;
      px[i] = ((a << 24) | (bl << 16) | (g << 8) | r) >>> 0;
      dk[i] = ((a << 24) | ((bl * 0.68 | 0) << 16) | ((g * 0.68 | 0) << 8) | (r * 0.68 | 0)) >>> 0;
    }
    return { px, dk, canvas: c };
  }
  const steelBase = x => {
    F(x, '#6f7787', 0, 0, 64, 64); speckle(x, 160, 'rgba(0,0,0,.12)'); speckle(x, 60, 'rgba(255,255,255,.08)');
    F(x, '#555c6c', 0, 31, 64, 2); F(x, '#555c6c', 31, 0, 2, 64); F(x, '#8a93a6', 0, 0, 64, 1); F(x, '#8a93a6', 0, 33, 64, 1); F(x, '#8a93a6', 0, 0, 1, 64); F(x, '#8a93a6', 33, 0, 1, 64);
    [[4, 4], [26, 4], [37, 4], [59, 4], [4, 26], [26, 26], [37, 26], [59, 26], [4, 37], [26, 37], [37, 37], [59, 37], [4, 59], [26, 59], [37, 59], [59, 59]].forEach(([a, y]) => { F(x, '#b9c0cf', a, y, 2, 2); F(x, '#3d4458', a + 1, y + 1, 1, 1); });
  };
  const hazardBand = (x, y0, h) => {
    x.save(); x.beginPath(); x.rect(0, y0, 64, h); x.clip(); F(x, '#1a1a1a', 0, y0, 64, h); x.fillStyle = '#f7c33c';
    for (let i = -16; i < 72; i += 12) { x.beginPath(); x.moveTo(i, y0 + h); x.lineTo(i + 6, y0 + h); x.lineTo(i + 6 + h, y0); x.lineTo(i + h, y0); x.fill(); }
    x.restore();
  };
  const WALLTEX = {
    '#': makeImg(steelBase),
    B: makeImg(x => { F(x, '#3b2320', 0, 0, 64, 64);
      for (let r = 0; r < 8; r++) { const off = (r % 2) * 8; for (let c = -1; c < 5; c++) { const sh = 130 + (rnd() * 30 | 0);
        F(x, `rgb(${sh},${sh * 0.42 | 0},${sh * 0.33 | 0})`, c * 16 - off + 1, r * 8 + 1, 14, 6); F(x, 'rgba(255,255,255,.12)', c * 16 - off + 1, r * 8 + 1, 14, 1); } }
      speckle(x, 80, 'rgba(0,0,0,.18)'); }),
    C: makeImg(x => { F(x, '#2b3040', 0, 0, 64, 64); F(x, '#3d4458', 2, 2, 60, 60); F(x, '#2b3040', 4, 4, 56, 56);
      F(x, '#0f3b2a', 6, 7, 26, 17); for (let i = 0; i < 5; i++) F(x, '#39d98a', 8, 9 + i * 3, 6 + (rnd() * 16 | 0), 1);
      F(x, '#3b2a0f', 36, 7, 22, 12); for (let i = 0; i < 3; i++) F(x, '#ffb347', 38, 9 + i * 3, 4 + (rnd() * 14 | 0), 1);
      ['#e8563a', '#f7c33c', '#39d98a', '#4fd1ff', '#e8563a', '#39d98a'].forEach((c, i) => F(x, c, 8 + i * 8, 30, 4, 3));
      [16, 44].forEach(cx => { O(x, '#8a93a6', cx, 47, 9); O(x, '#1a1d27', cx, 47, 7); O(x, '#8a93a6', cx, 47, 2); }); }),
    H: makeImg(x => { steelBase(x); hazardBand(x, 48, 10); hazardBand(x, 4, 5); }),
    T: makeImg(x => { F(x, '#1e2a4a', 0, 0, 64, 64); for (let i = 0; i < 64; i += 16) { F(x, '#2b3a63', i, 0, 1, 64); F(x, '#2b3a63', 0, i, 64, 1); }
      [8, 54].forEach(a => { F(x, '#2a7fb0', a - 1, 0, 4, 64); F(x, '#4fd1ff', a, 0, 2, 64); });
      F(x, '#12192e', 20, 20, 24, 24); F(x, '#4fd1ff', 24, 24, 4, 4); F(x, '#39d98a', 36, 24, 4, 4); F(x, '#2a7fb0', 24, 34, 16, 2); }),
    W: makeImg(x => { F(x, '#8d95a6', 0, 0, 64, 64); for (let i = 0; i < 64; i += 8) { F(x, '#6f7787', i, 0, 1, 64); F(x, '#b9c0cf', i + 1, 0, 1, 64); } }),
    E: makeImg(x => { F(x, '#8d95a6', 0, 0, 64, 64); for (let i = 0; i < 64; i += 8) { F(x, '#6f7787', i, 0, 1, 64); F(x, '#b9c0cf', i + 1, 0, 1, 64); }
      F(x, '#3d4458', 18, 12, 28, 40); F(x, '#2b3040', 20, 14, 24, 36); F(x, '#c9c6d8', 30, 18, 4, 18); O(x, '#e8563a', 32, 18, 4);
      O(x, '#39d98a', 25, 44, 3); O(x, '#e8563a', 39, 44, 3); hazardBand(x, 56, 6); })
  };
  const JAMB = makeImg(x => { F(x, '#4a5163', 0, 0, 64, 64); for (let i = 2; i < 64; i += 6) F(x, '#3a4052', i, 0, 2, 64); });
  const doorBase = (x, frame) => { F(x, '#58627a', 0, 0, 64, 64); speckle(x, 80, 'rgba(0,0,0,.12)'); F(x, frame, 0, 0, 64, 3); F(x, frame, 0, 61, 64, 3); F(x, frame, 0, 0, 3, 64); F(x, frame, 61, 0, 3, 64);
    hazardBand(x, 27, 9); F(x, '#c9c6d8', 50, 40, 6, 4); [[8, 8], [54, 8], [8, 52], [54, 52]].forEach(([a, y]) => F(x, '#b9c0cf', a, y, 2, 2)); };
  const DOORTEX = {
    D: makeImg(x => doorBase(x, '#3d4458')),
    Y: makeImg(x => { doorBase(x, '#f7c33c'); F(x, '#f7c33c', 26, 42, 12, 14); F(x, '#1a1a1a', 31, 45, 2, 7); O(x, '#1a1a1a', 32, 46, 2); }),
    U: makeImg(x => { doorBase(x, '#4fa3ff'); F(x, '#4fa3ff', 26, 42, 12, 14); F(x, '#1a1a1a', 31, 45, 2, 7); O(x, '#1a1a1a', 32, 46, 2); })
  };

  function robot(x, o, frame) {
    const { body, dark, eye, light } = o;
    if (frame === 'dead') {
      F(x, dark, 10, 54, 36, 9); F(x, body, 13, 51, 30, 6); F(x, body, 40, 49, 18, 13); F(x, '#15171f', 43, 52, 12, 5); F(x, eye, 45, 53, 7, 2);
      F(x, dark, 4, 58, 9, 5); F(x, light, 24, 47, 4, 4); F(x, '#2a2d38', 30, 58, 6, 5);
      O(x, 'rgba(110,110,120,.8)', 28, 42, 6); O(x, 'rgba(110,110,120,.6)', 34, 34, 4); return;
    }
    const lx = frame === 'walk1' ? -3 : frame === 'walk2' ? 3 : 0;
    F(x, dark, 22 + lx, 46, 7, 14); F(x, dark, 35 - lx, 46, 7, 14);
    F(x, '#2a2d38', 20 + lx, 59, 11, 5); F(x, '#2a2d38', 33 - lx, 59, 11, 5);
    F(x, body, 17, 26, 30, 21); F(x, dark, 17, 43, 30, 4); F(x, light, 18, 27, 28, 2);
    O(x, '#ffd34d', 32, 35, 3); F(x, dark, 21, 31, 4, 9); F(x, dark, 39, 31, 4, 9);
    if (o.armor) { F(x, dark, 7, 23, 13, 9); F(x, dark, 44, 23, 13, 9); F(x, light, 8, 23, 11, 2); F(x, light, 45, 23, 11, 2); }
    if (frame === 'aim' || frame === 'shoot') { F(x, dark, 10, 27, 6, 14); F(x, dark, 24, 33, 16, 8); F(x, '#2a2d38', 27, 36, 10, 10); O(x, '#ff5a1f', 32, 44, 3); }
    else { F(x, dark, 10, 27, 6, 16); F(x, dark, 48, 27, 6, 16); F(x, '#2a2d38', 9, 43, 8, 4); F(x, '#2a2d38', 47, 43, 8, 4); }
    F(x, dark, 29, 23, 6, 4); F(x, body, 21, 9, 22, 15); F(x, light, 22, 10, 20, 2); F(x, '#15171f', 24, 14, 16, 6);
    if (o.twoEyes) { F(x, eye, 26, 15, 5, 3); F(x, eye, 33, 15, 5, 3); } else F(x, eye, 26, 15, 12, 3);
    F(x, dark, 31, 3, 2, 7); O(x, eye, 32, 3, 2);
    if (o.horns) { F(x, dark, 17, 3, 4, 9); F(x, dark, 43, 3, 4, 9); F(x, light, 17, 3, 4, 2); F(x, light, 43, 3, 4, 2); }
    if (frame === 'shoot') { O(x, '#fff5cf', 32, 46, 9); O(x, '#ffd34d', 32, 46, 5); }
    if (frame === 'pain') { x.globalCompositeOperation = 'source-atop'; F(x, 'rgba(255,255,255,.5)', 0, 0, 64, 64); x.globalCompositeOperation = 'source-over';
      F(x, '#ffd34d', 13, 19, 2, 2); F(x, '#ffd34d', 49, 15, 2, 2); F(x, '#fff', 45, 39, 2, 2); }
  }
  const ROBO = {
    grunt: { body: '#8a93a6', dark: '#5b6275', eye: '#ff3b30', light: '#b9c0cf' },
    guard: { body: '#4a7bd1', dark: '#2c4f8f', eye: '#ffd34d', light: '#7fa8ec', armor: true, twoEyes: true },
    boss: { body: '#c8323a', dark: '#7a1a20', eye: '#39ff88', light: '#ff7a6b', armor: true, horns: true }
  };
  const SPR = {};
  for (const k in ROBO) { SPR[k] = {}; for (const f of ['stand', 'walk1', 'walk2', 'aim', 'shoot', 'pain', 'dead']) SPR[k][f] = makeImg(x => robot(x, ROBO[k], f)); }
  const battery = (x, s) => { const w = 16 * s, h = 22 * s, x0 = 32 - w / 2, y0 = 63 - h;
    F(x, '#f7c33c', x0, y0, w, h); F(x, '#1a1a1a', x0, y0 + h * 0.35, w, h * 0.2); F(x, '#c9c6d8', 32 - 3 * s, y0 - 3 * s, 6 * s, 3 * s); F(x, '#fff2b0', x0 + 2, y0 + 2, 2, h - 4); };
  const keyShape = (x, c) => { x.strokeStyle = c; x.lineWidth = 3; x.beginPath(); x.arc(22, 54, 6, 0, Math.PI * 2); x.stroke(); F(x, c, 27, 52, 20, 4); F(x, c, 40, 56, 3, 5); F(x, c, 45, 56, 3, 4); };
  const gunShape = (x, big) => { F(x, '#3d4458', 12, 50, 40, 9); F(x, '#5b6275', 12, 50, 40, 2); F(x, '#2a2d38', 20, 58, 7, 6);
    if (big) { F(x, '#2a2d38', 44, 47, 14, 3); F(x, '#2a2d38', 44, 52, 14, 3); F(x, '#2a2d38', 44, 57, 14, 3); } else { F(x, '#1fa3a3', 16, 53, 24, 2); F(x, '#2a2d38', 48, 52, 10, 4); } };
  const vinnyHead = (x, x0, y0, s) => { F(x, '#17a7a0', x0 + 2 * s, y0, 10 * s, 3 * s); F(x, '#0f7c77', x0 + s, y0 + 3 * s, 12 * s, s); F(x, '#f2b98a', x0 + 2 * s, y0 + 4 * s, 10 * s, 7 * s);
    F(x, '#1a1a1a', x0 + 4 * s, y0 + 6 * s, s, s); F(x, '#1a1a1a', x0 + 9 * s, y0 + 6 * s, s, s); F(x, '#4a2a14', x0 + 4 * s, y0 + 8 * s, 6 * s, s); };
  Object.assign(SPR, {
    h: makeImg(x => { F(x, '#c9c6d8', 18, 44, 28, 19); F(x, '#ffffff', 19, 45, 26, 17); F(x, '#e8563a', 29, 47, 6, 13); F(x, '#e8563a', 23, 51, 18, 5); }),
    f: makeImg(x => { x.fillStyle = '#d9a35a'; x.beginPath(); x.moveTo(14, 50); x.lineTo(50, 50); x.lineTo(32, 63); x.fill();
      x.fillStyle = '#f7d354'; x.beginPath(); x.moveTo(17, 53); x.lineTo(47, 53); x.lineTo(32, 62); x.fill(); O(x, '#c8323a', 27, 55, 2.5); O(x, '#c8323a', 36, 56, 2.5); }),
    a: makeImg(x => battery(x, 1)),
    b: makeImg(x => battery(x, 0.7)),
    k: makeImg(x => keyShape(x, '#f7c33c')),
    l: makeImg(x => keyShape(x, '#4fa3ff')),
    w: makeImg(x => gunShape(x, false)),
    m: makeImg(x => gunShape(x, true)),
    t: makeImg(x => { x.fillStyle = '#f7c33c'; for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; x.fillRect(32 + Math.cos(a) * 9 - 2, 53 + Math.sin(a) * 9 - 2, 4, 4); }
      O(x, '#f7c33c', 32, 53, 8); O(x, '#b3761a', 32, 53, 3); }),
    j: makeImg(x => { F(x, '#f7c33c', 24, 44, 16, 7); F(x, '#fff2b0', 25, 44, 14, 2); F(x, '#e8a91f', 29, 51, 6, 12); for (let y = 52; y < 63; y += 3) F(x, '#b3761a', 29, y, 6, 1); }),
    '1': makeImg(x => vinnyHead(x, 18, 36, 2)),
    o: makeImg(x => { F(x, '#9e1f28', 18, 26, 28, 38); F(x, '#c8323a', 20, 26, 24, 38); F(x, '#e8563a', 22, 26, 4, 38);
      hazardBand(x, 40, 8); F(x, '#7a1a20', 18, 26, 28, 3); F(x, '#7a1a20', 18, 60, 28, 3); F(x, '#7a1a20', 18, 34, 28, 2); }),
    c: makeImg(x => { F(x, '#3d4458', 31, 0, 2, 6); x.fillStyle = '#c9c6d8'; x.beginPath(); x.moveTo(26, 6); x.lineTo(38, 6); x.lineTo(43, 14); x.lineTo(21, 14); x.fill();
      O(x, '#fff5cf', 32, 15, 3); }),
    q: makeImg(x => { F(x, '#555c6c', 22, 0, 20, 64); F(x, '#8a93a6', 25, 0, 4, 64); F(x, '#3d4458', 38, 0, 3, 64);
      for (const y of [6, 30, 54]) { F(x, '#3d4458', 20, y, 24, 5); F(x, '#b9c0cf', 20, y, 24, 1); } })
  });

  // ---------------- maps ----------------
  /*MAPS*/
  const WALLCH = '#BCHTWE', DOORCH = 'DYUS';
  function mapBuilder(w, h) {
    const g = Array.from({ length: h }, () => Array(w).fill('#')), objs = [], bossDoors = new Set();
    const isW = (x, y) => WALLCH.includes(g[y][x]);
    return { w, h, g, objs, bossDoors,
      room(x1, y1, x2, y2, wall = '#') {
        for (let y = y1 - 1; y <= y2 + 1; y++) for (let x = x1 - 1; x <= x2 + 1; x++) {
          if (x < 0 || y < 0 || x >= w || y >= h) continue;
          if (x >= x1 && x <= x2 && y >= y1 && y <= y2) g[y][x] = '.'; else if (isW(x, y)) g[y][x] = wall;
        }
      },
      door(x, y, t = 'D') { g[y][x] = t; },
      bossDoor(x, y) { g[y][x] = 'D'; bossDoors.add(x + ',' + y); },
      exit(x, y) { g[y][x] = 'E'; },
      put(list) { for (const [c, x, y] of list) objs.push({ c, x, y }); }
    };
  }
  // objects: > < ^ v start · r grunt · g guard · X boss · h medkit · f pizza · a battery · k/l gold/blue key
  // w blaster · m mega cannon · t gear · j golden bolt · 1 extra life · o barrel · c lamp · q pillar
  const LEVELS = [
    { name: 'FLOOR 1', title: 'LOADING DOCK', w: 24, h: 22, ceil: [60, 66, 80], floor: [88, 86, 84],
      build(L) {
        L.room(1, 1, 5, 5, '#'); L.room(7, 2, 16, 4, 'T'); L.door(6, 3);
        L.room(7, 6, 16, 12, '#'); L.door(11, 5);
        L.room(1, 7, 5, 11, 'B'); L.door(6, 9);
        L.room(1, 13, 3, 15, 'B'); L.door(2, 12, 'S');
        L.room(18, 6, 22, 12, 'H'); L.door(17, 9);
        L.room(8, 14, 14, 17, '#'); L.door(11, 13, 'Y');
        L.room(10, 19, 12, 20, 'W'); L.door(11, 18); L.exit(11, 21);
        L.put([['>', 3, 3], ['o', 1, 5], ['a', 5, 1], ['c', 3, 1],
          ['r', 10, 3], ['c', 13, 3],
          ['q', 9, 8], ['q', 14, 8], ['q', 9, 11], ['q', 14, 11], ['r', 12, 10], ['r', 8, 7], ['c', 11, 9], ['h', 16, 12], ['t', 7, 12],
          ['a', 2, 8], ['r', 4, 10], ['f', 1, 11], ['o', 5, 7],
          ['t', 1, 14], ['j', 3, 14], ['h', 2, 15],
          ['k', 21, 7], ['r', 20, 9], ['r', 19, 11], ['o', 22, 12], ['t', 22, 6],
          ['r', 9, 16], ['r', 13, 15], ['c', 11, 15], ['a', 14, 17]]);
      } },

  function render3D() {

      let side = 0, dist = 30, tex = null, texX = 0, guard = 0;
      while (guard++ < 64) {
        const wasDoor = DOORCH.includes(grid[my][mx]);
        if (sdx < sdy) { sdx += ddx; mx += stepX; side = 0; } else { sdy += ddy; my += stepY; side = 1; }
        if (mx < 0 || my < 0 || mx >= MW || my >= MH) break;

        if (isWall(c)) {

          texX = (wx * TS) | 0;

          tex = wasDoor ? JAMB : WALLTEX[c];
          break;
        }
        // door: a panel in the middle of its cell that slides sideways as it opens
        const d = doorAt(mx, my);
        const dm = side === 0 ? sdx - ddx * 0.5 : sdy - ddy * 0.5;
        let wx;
        if (side === 0) { const wy = py + dm * rdy; if (Math.floor(wy) !== my) continue; wx = wy - my; }
        else { const wxx = px + dm * rdx; if (Math.floor(wxx) !== mx) continue; wx = wxx - mx; }
        if (wx < d.open) continue;
        dist = dm; texX = Math.min(TS - 1, ((wx - d.open) * TS) | 0);

    for (const e of enemies) list.push({ x: e.x, y: e.y, img: enemyFrame(e), scale: EN[e.k].scale });
    for (const s of list) s.d = (s.x - px) ** 2 + (s.y - py) ** 2;

      txt('BOOM BOTS', RW / 2, 26, { align: 'center', size: 16, col: '#ff8a3d' });
      txt('3D', RW / 2, 46, { align: 'center', size: 12, col: '#f7c33c' });
      txt('starring VINNY', RW / 2, 64, { align: 'center', size: 6, col: '#7fe0cc' });
      txt("ESCAPE THE MEATBALL KING'S", RW / 2, 76, { align: 'center', size: 5, col: '#d9dcea' });
      txt('ROBOT FACTORY', RW / 2, 84, { align: 'center', size: 5, col: '#d9dcea' });
      const lines = isTouch ? ['STICK: MOVE + TURN', 'FIRE / OPEN / WPN / MAP BUTTONS']
        : ['W/S MOVE  A/D STRAFE  ARROWS TURN', 'SPACE FIRE  E OPEN  1-4 WEAPON', 'SHIFT RUN  TAB MAP  CLICK = MOUSE AIM'];
      lines.forEach((l, i) => txt(l, RW / 2, 100 + i * 9, { align: 'center', size: 4, col: '#9aa3c0' }));
      if (blink) txt(isTouch ? 'TAP TO START' : 'PRESS ENTER', RW / 2, 134, { align: 'center', size: 7 });
      txt('TOP ' + String(top).padStart(6, '0'), RW / 2, 176, { align: 'center', size: 6, col: '#9aa3c0' });
    } else if (state === 'intro') {
      F(b, '#07080d', 0, 0, RW, VH);
      txt(def.name, RW / 2, 56, { align: 'center', size: 10, col: '#ff8a3d' });
      txt(def.title, RW / 2, 76, { align: 'center', size: 7 });
      txt('GET READY, VINNY', RW / 2, 100, { align: 'center', size: 5, col: '#9aa3c0' });
      drawHud();
    } else if (state === 'tally') {
      F(b, '#07080d', 0, 0, RW, VH);
      txt(def.name + ' COMPLETE', RW / 2, 16, { align: 'center', size: 8, col: '#39d98a' });
      const rows = [['KILLS', tally.kills + '%'], ['SECRETS', tally.secrets + '%'], ['TREASURE', tally.treasure + '%'],
        ['TIME', Math.floor(tally.time / 60) + ':' + String(Math.floor(tally.time % 60)).padStart(2, '0')], ['BONUS', String(tally.bonus)]];
      rows.forEach(([k, v], i) => { txt(k, 80, 44 + i * 16, { size: 7, col: '#9aa3c0' }); txt(v, 240, 44 + i * 16, { size: 7, align: 'right' }); });
      if (endT > 0.8 && blink) txt(isTouch ? 'TAP TO GO ON' : 'PRESS ENTER', RW / 2, 138, { align: 'center', size: 6 });
      drawHud();
    } else if (state === 'over') {
      F(b, '#1a0507', 0, 0, RW, VH);
      txt('GAME OVER', RW / 2, 54, { align: 'center', size: 12, col: '#ff6b5a' });
      if (endT > 1 && blink) txt((isTouch ? 'TAP' : 'PRESS ENTER') + ' TO RETRY ' + def.name, RW / 2, 96, { align: 'center', size: 5 });
      drawHud();
    } else if (state === 'win') {
      F(b, '#07080d', 0, 0, RW, RH);
      panel(24, 24, 272, 150, '#39d98a');
      txt('FACTORY SHUT DOWN!', RW / 2, 44, { align: 'center', size: 8, col: '#39d98a' });
      txt('THE BOOM BOTS ARE SCRAP', RW / 2, 66, { align: 'center', size: 5 });
      txt('AND VINNY IS HEADED HOME', RW / 2, 76, { align: 'center', size: 5 });
      txt('FOR A BIG PLATE OF PASTA.', RW / 2, 86, { align: 'center', size: 5 });
      txt('SCORE ' + String(P.score).padStart(6, '0'), RW / 2, 110, { align: 'center', size: 7, col: '#f7c33c' });
      txt('TOP   ' + String(top).padStart(6, '0'), RW / 2, 124, { align: 'center', size: 7, col: '#9aa3c0' });
      if (endT > 1 && blink) txt(isTouch ? 'TAP FOR TITLE' : 'PRESS ENTER', RW / 2, 150, { align: 'center', size: 6 });
    } else {
      render3D();
      if (state !== 'dead') drawWeapon();
      if (showMap) drawMap();
      if (msg) txt(msg.text, RW / 2, 10, { align: 'center', size: 6, col: '#f7c33c' });
      if (dmgFlash > 0) { b.fillStyle = `rgba(232,40,30,${Math.min(0.5, dmgFlash)})`; b.fillRect(0, 0, RW, VH); }
      if (bonusFlash > 0) { b.fillStyle = `rgba(247,195,60,${Math.min(0.3, bonusFlash)})`; b.fillRect(0, 0, RW, VH); }
      if (state === 'dead') { b.fillStyle = `rgba(150,10,10,${Math.min(0.8, deadT * 0.6)})`; b.fillRect(0, 0, RW, VH); }
      if (!showMap && state === 'play') { F(b, 'rgba(255,244,224,.6)', RW / 2 - 1, VH / 2 - 4, 2, 3); F(b, 'rgba(255,244,224,.6)', RW / 2 - 1, VH / 2 + 2, 2, 3); }
      if (paused) { b.fillStyle = 'rgba(0,0,0,.55)'; b.fillRect(0, 0, RW, VH); txt('PAUSED', RW / 2, 64, { align: 'center', size: 10 }); txt(isTouch ? 'TAP TO RESUME' : 'PRESS P TO RESUME', RW / 2, 84, { align: 'center', size: 5 }); }
      drawHud();
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#07080d'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(buf, 0, 0, RW, RH, Math.round(offX * DPR), Math.round(offY * DPR), Math.round(RW * S * DPR), Math.round(RH * S * DPR));
    flushText();
  }

  // ---------------- input ----------------
  function canPause() { return state === 'play'; }
  function togglePause() {
    if (!canPause() && !paused) return;
    paused = !paused; for (const k in keys) keys[k] = false;
    if (AC) { paused ? AC.suspend() : AC.resume(); }
    if (paused) exitLock();
    updateButtons();
  }
  function toggleMute() { muted = !muted; applyGain(); updateButtons(); try { localStorage.setItem('boombots-muted', muted ? '1' : '0'); } catch (e) {} }
  function updateButtons() {
    pauseBtn.hidden = !(canPause() || paused);
    pauseBtn.textContent = paused ? 'Resume' : 'Pause';
    soundBtn.textContent = muted ? 'Sound off' : 'Sound on';
  }
  function cycleWeapon(dir = 1) {
    let i = WORDER.indexOf(P.cur);
    for (let n = 0; n < 4; n++) { i = (i + dir + 4) % 4; if (P.weapons[WORDER[i]]) { P.cur = WORDER[i]; if (WPN[P.cur].ammo) P.lastGun = P.cur; return; } }
  }
  function exitLock() { try { if (document.pointerLockElement === cv) document.exitPointerLock(); } catch (e) {} }

  const KM = { KeyW: 'fwd', ArrowUp: 'fwd', KeyS: 'back', ArrowDown: 'back', ArrowLeft: 'tl', ArrowRight: 'tr', KeyA: 'sl', KeyD: 'sr',
    ShiftLeft: 'run', ShiftRight: 'run', Space: 'fire', ControlLeft: 'fire', ControlRight: 'fire' };
  addEventListener('keydown', e => {
    initAudio();
    if (e.target && e.target.tagName === 'BUTTON' && (e.code === 'Enter' || e.code === 'Space')) return;
    if ((e.code === 'Enter' || e.code === 'Space') && (state === 'title' || state === 'tally' || state === 'over' || state === 'win')) { e.preventDefault(); handleStart(); return; }
    if (e.code === 'KeyP' || (e.code === 'Escape' && !document.pointerLockElement)) { togglePause(); return; }
    if (e.code === 'KeyM') { toggleMute(); return; }
    if (e.code === 'Tab') { e.preventDefault(); if (state === 'play') showMap = !showMap; return; }
    if (state !== 'play' || paused) return;
    if (e.code === 'KeyE' || e.code === 'Enter') { if (!e.repeat) useAhead(); return; }
    const dg = /^Digit([1-4])$/.exec(e.code);
    if (dg) { const w = WORDER[+dg[1] - 1]; if (P.weapons[w]) { P.cur = w; if (WPN[w].ammo) P.lastGun = w; } return; }
    if (e.code === 'KeyQ') { cycleWeapon(1); return; }
    const k = KM[e.code]; if (k) { e.preventDefault(); keys[k] = true; }
  });
  addEventListener('keyup', e => { const k = KM[e.code]; if (k) keys[k] = false; });
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (canPause() && !paused) togglePause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && canPause() && !paused) togglePause(); });
  addEventListener('mousemove', e => { if (document.pointerLockElement === cv && state === 'play' && !paused) pendingTurn += e.movementX * 0.0026; });
  cv.addEventListener('mousedown', e => {
    initAudio(); cv.focus();
    if (state === 'title' || state === 'tally' || state === 'over' || state === 'win') { handleStart(); return; }
    if (paused) { togglePause(); return; }
    if (state !== 'play' || isTouch) return;
    if (document.pointerLockElement === cv) { if (e.button === 0) keys.fire = true; if (e.button === 2) useAhead(); return; }
    try { const p = cv.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (err) {}
  });
  addEventListener('mouseup', e => { if (e.button === 0 && document.pointerLockElement === cv) keys.fire = false; });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('touchstart', () => { initAudio(); if (state === 'title' || state === 'tally' || state === 'over' || state === 'win') handleStart(); else if (paused) togglePause(); }, { passive: true });
  pauseBtn.addEventListener('click', () => { initAudio(); togglePause(); cv.focus(); });
  soundBtn.addEventListener('click', () => { initAudio(); toggleMute(); cv.focus(); });

  const stick = document.getElementById('stick'), nub = document.getElementById('nub');
  let stickId = null;
  function stickMove(e) {
    const r = stick.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let dx = e.clientX - cx, dy = e.clientY - cy; const max = r.width / 2 - 12, l = Math.hypot(dx, dy);
    if (l > max) { dx *= max / l; dy *= max / l; }
    nub.style.transform = `translate(${dx}px, ${dy}px)`;
    joy.x = Math.abs(dx / max) < 0.15 ? 0 : dx / max; joy.y = Math.abs(dy / max) < 0.15 ? 0 : dy / max;
  }
  stick.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); stickId = e.pointerId; stick.setPointerCapture(e.pointerId); stickMove(e);
    if (state === 'title' || state === 'tally' || state === 'over' || state === 'win') handleStart(); else if (paused) togglePause(); });
  stick.addEventListener('pointermove', e => { if (e.pointerId === stickId) stickMove(e); });
  const stickUp = e => { if (e.pointerId !== stickId) return; stickId = null; joy.x = joy.y = 0; nub.style.transform = ''; };
  stick.addEventListener('pointerup', stickUp); stick.addEventListener('pointercancel', stickUp);
  document.querySelectorAll('.btns button').forEach(btn => {
    const k = btn.dataset.k;
    btn.addEventListener('pointerdown', e => {
      e.preventDefault(); initAudio(); btn.classList.add('on');
      if (state === 'title' || state === 'tally' || state === 'over' || state === 'win') { handleStart(); return; }
      if (paused) { togglePause(); return; }
      if (state !== 'play') return;
      if (k === 'fire') keys.fire = true; else if (k === 'use') useAhead(); else if (k === 'wpn') cycleWeapon(1); else if (k === 'map') showMap = !showMap;
    });
    const up = () => { btn.classList.remove('on'); if (k === 'fire') keys.fire = false; };
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => btn.addEventListener(ev, up));
    btn.addEventListener('contextmenu', e => e.preventDefault());
  });

  // ---------------- boot ----------------
  loadLevel(0); resetLoadout(); updateButtons();
  if (document.fonts && document.fonts.load) document.fonts.load('8px "Press Start 2P"').catch(() => {});
  let last = performance.now(), acc = 0;
  function frame(t) {
    acc += Math.min(100, t - last); last = t;
    let n = 0;
    while (acc >= 1000 / 60 && n < 5) { step(1 / 60); acc -= 1000 / 60; n++; }
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  cv.focus();
})();
</script>
