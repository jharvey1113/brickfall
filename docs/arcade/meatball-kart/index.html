<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>Meatball Kart</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600;800&display=swap">
<style>
  :root { color-scheme: dark; --bg: #0b1020; --ink: #fff8ec; --dim: #c7cbe0; --glass: rgba(10, 13, 28, .62); --edge: rgba(255, 255, 255, .16);
          --gold: #ffcf3a; --ember: #ff7a2e; --teal: #3fd6c6; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; font-family: "Rubik", system-ui, sans-serif; }
  /* a game, not a document: no text selection, copy popups or double-tap zoom */
  html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
               touch-action: none; overscroll-behavior: none; }
  .overlay { touch-action: pan-y; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
  .display { font-family: "Bungee", "Rubik", system-ui, sans-serif; letter-spacing: .02em; }
  .glass { background: var(--glass); border: 1px solid var(--edge); border-radius: 12px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  .hud-tl { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 16px; padding: 10px 14px; display: grid; gap: 2px; }
  .lap { font-size: 26px; line-height: 1; }
  .lap small { font-family: "Rubik", sans-serif; font-weight: 800; font-size: 13px; letter-spacing: .12em; color: var(--dim); margin-right: 6px; }
  .time { font-family: "Rubik", sans-serif; font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--dim); }
  .hud-tr { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 56px); right: 16px; }
  .itembox { width: 76px; height: 76px; display: grid; place-items: center; border-radius: 14px; border: 3px solid rgba(255, 255, 255, .55);
             background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, .25), rgba(10, 13, 28, .6)); }
  .itembox svg { width: 54px; height: 54px; }
  #minimap { position: absolute; left: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); width: 150px; height: 150px; }
  .place { position: absolute; right: 22px; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); font-size: 88px; line-height: 1;
           background: linear-gradient(180deg, #fff6b0, var(--gold) 45%, var(--ember)); -webkit-background-clip: text; background-clip: text; color: transparent;
           filter: drop-shadow(0 4px 0 rgba(60, 20, 0, .7)); }
  .place sup { font-size: 36px; vertical-align: top; }
  .sig { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; color: var(--gold); letter-spacing: .02em; }
  .sig svg { width: 22px; height: 22px; flex: none; }
  .banner { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); font-size: clamp(26px, 6vw, 56px); width: max-content; max-width: 92vw;
            text-align: center; line-height: 1.1; text-wrap: balance;
            color: var(--gold); text-shadow: 0 4px 0 #6a2a00, 0 0 24px rgba(255, 122, 46, .6); opacity: 0; transition: opacity .2s; }
  .banner.show { opacity: 1; }
  .banner.warn { color: #ff5a4a; }
  #count { position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%); font-size: clamp(64px, 16vw, 150px); z-index: 2; pointer-events: none;
           color: #fff; text-shadow: 0 6px 0 #6a2a00, 0 0 40px rgba(255, 200, 60, .8); }

  .overlay { position: fixed; inset: 0; z-index: 3; display: grid; place-items: center; padding-inline: 16px; overflow-y: auto; }
  .overlay[hidden] { display: none !important; }
  .panel { width: min(920px, 100%); padding: 26px clamp(16px, 4vw, 34px) 24px; margin-block: 24px; }
  .logo { margin: 0; font-size: clamp(38px, 8vw, 78px); line-height: .95; text-align: center;
          background: linear-gradient(180deg, #fff6b0 10%, var(--gold) 45%, var(--ember) 90%); -webkit-background-clip: text; background-clip: text; color: transparent;
          filter: drop-shadow(0 5px 0 #5a1f00); }
  .tag { text-align: center; margin: 10px 0 22px; color: var(--dim); font-weight: 600; letter-spacing: .14em; font-size: 13px; text-transform: uppercase; }
  .racers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 640px) { .racers { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  #rotateHint { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 118px); transform: translateX(-50%); z-index: 5;
                display: flex; align-items: center; gap: 10px; padding: 10px 14px; font-weight: 600; font-size: 13px; white-space: nowrap; pointer-events: none; }
  #rotateHint svg { width: 26px; height: 26px; flex: none; }
  [hidden], #rotateHint[hidden] { display: none !important; }
  .racer { font: inherit; color: inherit; text-align: left; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--edge);
           background: rgba(255, 255, 255, .05); cursor: pointer; display: grid; gap: 8px; transition: transform .12s, border-color .12s, background .12s; }
  .racer:hover { background: rgba(255, 255, 255, .09); }
  .racer.sel { border-color: var(--gold); background: rgba(255, 207, 58, .12); transform: translateY(-2px); }
  .racer:focus-visible, .btn:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
  .rname { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; letter-spacing: .03em; }
  .swatch { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .7); flex: none; }
  .stat { display: grid; grid-template-columns: 58px 1fr; align-items: center; gap: 8px; font-size: 11px; color: var(--dim); letter-spacing: .08em; text-transform: uppercase; }
  .bar { height: 7px; border-radius: 4px; background: rgba(255, 255, 255, .12); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--teal), var(--gold)); }
  .row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center; margin-top: 22px; }
  .btn { font: inherit; font-family: "Bungee", sans-serif; font-size: 18px; padding: 12px 26px; border-radius: 12px; cursor: pointer; border: none;
         color: #2a1200; background: linear-gradient(180deg, #fff1a0, var(--gold) 50%, var(--ember)); box-shadow: 0 4px 0 #6a2a00; }
  .btn.ghost { color: var(--ink); background: rgba(255, 255, 255, .08); box-shadow: none; border: 2px solid var(--edge); font-size: 14px; }
  .help { margin-top: 16px; text-align: center; color: var(--dim); font-size: 12.5px; line-height: 1.7; }
  .help kbd { font-family: inherit; font-weight: 800; color: var(--ink); background: rgba(255, 255, 255, .1); border-radius: 4px; padding: 1px 6px; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
  td { padding: 9px 8px; border-bottom: 1px solid var(--edge); font-weight: 600; }
  td:first-child { font-family: "Bungee", sans-serif; width: 56px; color: var(--gold); }
  td:last-child { text-align: right; color: var(--dim); }
  tr.me td { background: rgba(255, 207, 58, .12); }
  .res-title { text-align: center; font-size: clamp(30px, 6vw, 48px); margin: 0 0 6px; color: var(--gold); text-shadow: 0 4px 0 #6a2a00; }
  .res-sub { text-align: center; color: var(--dim); margin: 0 0 8px; }
  #err { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; z-index: 9; }

  .topbar { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 16px; display: flex; gap: 8px; z-index: 4; }
  .topbar button { font: inherit; font-size: 12px; font-weight: 600; padding: 7px 11px; border-radius: 8px; cursor: pointer; color: var(--ink);
                   background: rgba(10, 13, 28, .6); border: 1px solid var(--edge); }
  .topbar button:hover { border-color: var(--gold); }
  .touch { display: none; position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); z-index: 2;
           justify-content: space-between; align-items: flex-end; padding-inline: 16px; pointer-events: none; }
  /* phones: keep place, item and map up top, away from the thumbs */
  @media (hover: none) and (pointer: coarse) {
    .touch { display: flex; }
    .hud-tr { top: calc(env(safe-area-inset-top, 0px) + 50px); }
    .itembox { width: 64px; height: 64px; } .itembox svg { width: 46px; height: 46px; }
    .place { top: calc(env(safe-area-inset-top, 0px) + 50px); bottom: auto; right: 96px; font-size: 52px; }
    .place sup { font-size: 22px; }
    #minimap { top: calc(env(safe-area-inset-top, 0px) + 92px); bottom: auto; width: 96px; height: 96px; }
  }
  @media (hover: none) and (pointer: coarse) and (max-width: 440px) {
    .touch { padding-inline: 10px; } .pad { gap: 8px; }
    .touch .pad button { width: 54px; height: 54px; font-size: 10px; } .touch .pad button.big { width: 64px; height: 64px; }
  }
  @media (hover: none) and (pointer: coarse) and (max-height: 500px) {
    .touch { bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); }
    .touch .pad button { width: 60px; height: 60px; } .touch .pad button.big { width: 72px; height: 72px; }
    .hud-tl { padding: 6px 10px; } .lap { font-size: 20px; }
    #minimap { top: calc(env(safe-area-inset-top, 0px) + 70px); width: 80px; height: 80px; }
    .panel { margin-block: 12px; padding-block: 16px; } .tag { margin: 6px 0 12px; }
  }
  .pad { display: flex; gap: 12px; pointer-events: auto; align-items: flex-end; }
  .touch button { width: 70px; height: 70px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .35); background: rgba(10, 13, 28, .45);
                  color: #fff; font: inherit; font-weight: 800; font-size: 12px; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  .touch button.big { width: 84px; height: 84px; background: rgba(255, 122, 46, .35); border-color: rgba(255, 170, 80, .8); }
  .touch button.on { filter: brightness(1.7); }
</style>

<div id="app"></div>
<div id="hud" hidden>
  <div class="hud-tl glass"><div class="lap display"><small>LAP</small><span id="lapN">1</span>/3</div><div class="time" id="timeT">0:00.000</div></div>
  <div class="hud-tr"><div class="itembox" id="itemBox" aria-label="Item"></div></div>
  <canvas id="minimap" width="300" height="300" aria-hidden="true"></canvas>
  <div class="place display" id="place">1<sup>st</sup></div>
  <div class="banner display" id="banner"></div>
</div>
<div id="count" class="display"></div>

<div id="menu" class="overlay">
  <div class="panel glass">
    <h1 class="logo display">MEATBALL KART</h1>
    <p class="tag">Meatball Meadows Grand Prix · 3 laps · 7 racers</p>
    <div class="racers" id="racers"></div>
    <div class="row"><button class="btn" id="startBtn" type="button">Start race</button></div>
    <p class="help" id="helpText"></p>
  </div>
</div>
<div id="results" class="overlay" hidden>
  <div class="panel glass" style="max-width:560px">
    <h2 class="res-title display" id="resTitle">FINISH!</h2>
    <p class="res-sub" id="resSub"></p>
    <table id="resTable"></table>
    <div class="row"><button class="btn" id="againBtn" type="button">Race again</button><button class="btn ghost" id="pickBtn" type="button">Choose racer</button></div>
  </div>
</div>
<div id="pauseOv" class="overlay" hidden>
  <div class="panel glass" style="max-width:420px;text-align:center">
    <h2 class="res-title display">PAUSED</h2>
    <div class="row"><button class="btn" id="resumeBtn" type="button">Resume</button><button class="btn ghost" id="quitBtn" type="button">Quit to menu</button></div>
  </div>
</div>
<div class="topbar"><button id="fsBtn" type="button" hidden>Full screen</button><button id="pauseBtn" type="button" hidden>Pause</button><button id="soundBtn" type="button">Sound on</button></div>
<div id="rotateHint" class="glass" hidden><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="9" y="3" width="14" height="24" rx="3" fill="none" stroke="#ffcf3a" stroke-width="2.4"/><path d="M4 22a13 13 0 0 0 9 7" fill="none" stroke="#3fd6c6" stroke-width="2.4" stroke-linecap="round"/><path d="M11 27l2 2-3 1" fill="none" stroke="#3fd6c6" stroke-width="2.4" stroke-linecap="round"/></svg>Turn your phone sideways for a bigger view</div>
<div class="touch">
  <div class="pad"><button type="button" data-k="left" aria-label="Steer left">◀</button><button type="button" data-k="right" aria-label="Steer right">▶</button></div>
  <div class="pad"><button type="button" data-k="brake">BRAKE</button><button type="button" data-k="item">ITEM</button><button type="button" data-k="drift" class="big">DRIFT</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(() => {
  'use strict';
  if (!window.THREE) {
    const d = document.createElement('div'); d.id = 'err';
    d.innerHTML = '<p>The 3D engine could not load. Check your internet connection and reload the page.</p>';
    document.body.appendChild(d); return;
  }
  const V3 = THREE.Vector3, TAU = Math.PI * 2;
  if (THREE.ColorManagement) THREE.ColorManagement.legacyMode = false;
  const isTouch = matchMedia('(hover: none) and (pointer: coarse)').matches;
  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const wrapAng = a => Math.atan2(Math.sin(a), Math.cos(a));
  function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rng = mulberry(20260924);

  // ---------------- renderer, scene, sky ----------------
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isTouch ? 1.5 : 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.98;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  $('app').appendChild(renderer.domElement);
  renderer.domElement.tabIndex = 0;
  const maxAniso = renderer.capabilities.getMaxAnisotropy();

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, 0.1, 2400);
  // Portrait phones get a taller field of view so the track stays visible side to side.
  let baseFov = 68;
  function fitView() {
    const w = innerWidth, h = innerHeight; renderer.setSize(w, h); camera.aspect = w / h;
    baseFov = camera.aspect < 1 ? clamp(2 * Math.atan(Math.tan(35 * Math.PI / 180) / camera.aspect) * 180 / Math.PI, 68, 90) : 68;
    camera.fov = baseFov; camera.updateProjectionMatrix();
    if (typeof updateRotateHint === 'function') updateRotateHint();
  }
  addEventListener('resize', fitView);
  addEventListener('orientationchange', () => setTimeout(fitView, 300));
  if (window.visualViewport) visualViewport.addEventListener('resize', fitView);

  const SUN_DIR = new V3(0.45, 0.62, -0.64).normalize();
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: { top: { value: new THREE.Color('#2f7fe0') }, horizon: { value: new THREE.Color('#d6ecff') }, bottom: { value: new THREE.Color('#a6c98c') }, sunDir: { value: SUN_DIR } },
    vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: `uniform vec3 top; uniform vec3 horizon; uniform vec3 bottom; uniform vec3 sunDir; varying vec3 vDir;
      void main(){ vec3 d = normalize(vDir); float h = d.y;
        vec3 col = h > 0.0 ? mix(horizon, top, pow(h, 0.55)) : mix(horizon, bottom, pow(-h, 0.35));
        float s = max(dot(d, sunDir), 0.0);
        col += vec3(1.0, 0.92, 0.75) * pow(s, 900.0) * 3.0 + vec3(1.0, 0.85, 0.6) * pow(s, 10.0) * 0.28;
        gl_FragColor = vec4(col, 1.0);
        #include <encodings_fragment>
      }`
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(1800, 32, 16), skyMat);
  scene.add(sky);
  scene.fog = new THREE.Fog(new THREE.Color('#d6ecff'), 280, 1500);
  {
    const pm = new THREE.PMREMGenerator(renderer), envScene = new THREE.Scene();
    envScene.add(new THREE.Mesh(new THREE.SphereGeometry(10, 32, 16), skyMat));
    scene.environment = pm.fromScene(envScene, 0.02).texture;
  }
  const hemi = new THREE.HemisphereLight(0xdcefff, 0x6a8a4a, 0.4); scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff0d8, 1.9);
  sun.castShadow = true; sun.shadow.mapSize.set(isTouch ? 1024 : 2048, isTouch ? 1024 : 2048);
  Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, near: 1, far: 420 });
  sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
  scene.add(sun); scene.add(sun.target);

  function canvasTex(w, h, draw, repeat) {
    const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = maxAniso;
    if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
    return t;
  }

  // ---------------- track ----------------
  const CTRL = [[0, 0, 0], [70, 0, -5], [135, 1.5, -45], [165, 5, -120], [140, 8, -190], [70, 6, -215], [10, 3, -175], [-20, 0, -110],
    [-75, 2, -95], [-140, 6, -120], [-190, 8, -60], [-175, 5, 20], [-120, 2, 65], [-55, 0, 45]];
  const curve = new THREE.CatmullRomCurve3(CTRL.map(([x, y, z]) => new V3(x, y, z)), true, 'centripetal');
  const N = 900, HALF = 7.5, WALL = 16, FLAT = HALF + 5;
  const SP = curve.getSpacedPoints(N);
  const TX = new Float32Array(N), TY = new Float32Array(N), TZ = new Float32Array(N), DX = new Float32Array(N), DZ = new Float32Array(N), SX = new Float32Array(N), SZ = new Float32Array(N), CUM = new Float32Array(N + 1);
  for (let i = 0; i < N; i++) {
    const p = SP[i], q = SP[i + 1];
    TX[i] = p.x; TY[i] = p.y; TZ[i] = p.z;
    const dx = q.x - p.x, dz = q.z - p.z, l = Math.hypot(dx, dz) || 1;
    DX[i] = dx / l; DZ[i] = dz / l; SX[i] = DZ[i]; SZ[i] = -DX[i]; // side = left of travel
    CUM[i + 1] = CUM[i] + Math.hypot(q.x - p.x, q.y - p.y, q.z - p.z);
  }
  const TRACK_LEN = CUM[N];
  const wrapI = i => ((i % N) + N) % N;
  function nearestIdx(x, z, guess) {
    let best = guess, bd = Infinity;
    if (guess < 0) { for (let i = 0; i < N; i += 3) { const d = (TX[i] - x) ** 2 + (TZ[i] - z) ** 2; if (d < bd) { bd = d; best = i; } } guess = best; }
    for (let k = -18; k <= 18; k++) { const i = wrapI(guess + k), d = (TX[i] - x) ** 2 + (TZ[i] - z) ** 2; if (d < bd) { bd = d; best = i; } }
    return best;
  }
  const lateralAt = (x, z, i) => (x - TX[i]) * SX[i] + (z - TZ[i]) * SZ[i];
  function hills(x, z) { return 7 * Math.sin(x * 0.011) * Math.cos(z * 0.013) + 4 * Math.sin((x + z) * 0.021) + 2.5 * Math.cos(x * 0.034 - z * 0.019); }
  function groundAt(i, lat, x, z) {
    const d = Math.abs(lat); let y = TY[i] - 0.08;
    if (d > FLAT) y += Math.min((d - FLAT) * 0.16, 5);
    if (x !== undefined && d > 30) y += (hills(x, z) + 6) * clamp((d - 30) / 60, 0, 1);
    return y;
  }

  function strip(fa, fb, vScale, mat, opts = {}) {
    const pos = [], uv = [], idx = [];
    for (let i = 0; i <= N; i++) {
      const j = i % N, a = fa(j), c = fb(j), v = CUM[i] / vScale;
      pos.push(...a, ...c); uv.push(0, v, 1, v);
      if (i < N) { const k = i * 2; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.setIndex(idx); g.computeVertexNormals();
    const m = new THREE.Mesh(g, mat); m.receiveShadow = true; if (opts.cast) m.castShadow = true;
    scene.add(m); return m;
  }
  const at = (i, lat, dy) => [TX[i] + SX[i] * lat, TY[i] + dy, TZ[i] + SZ[i] * lat];

  const roadTex = canvasTex(256, 512, (g, w, h) => {

    if (snap) camPos.copy(want); else camPos.lerp(want, 1 - Math.exp(-7 * dt));
    const look = new V3(k.pos.x + fx * 5, k.pos.y + 1.4, k.pos.z + fz * 5);
    if (snap) camLook.copy(look); else camLook.lerp(look, 1 - Math.exp(-10 * dt));
    camera.position.copy(camPos); camera.lookAt(camLook);
    const fov = baseFov + (k.boostT > 0 ? 9 : 0) + clamp(k.speed / 40, 0, 1) * 4;
    camera.fov += (fov - camera.fov) * Math.min(1, 4 * dt); camera.updateProjectionMatrix();
  }
  function update(dt) {
    for (const c of clouds) { c.position.x += dt * 3; if (c.position.x > 800) c.position.x = -800; }
    for (const b of itemBoxes) { b.mesh.rotation.y += dt * 1.4; b.mesh.rotation.x = Math.sin(raceT * 1.3 + b.phase) * 0.3; b.mesh.position.y = b.y + Math.sin(raceT * 2 + b.phase) * 0.2;
      if (!b.mesh.visible && (b.t -= dt) <= 0) b.mesh.visible = true; }
    padTex.offset.y -= dt * 1.4;
    updParticles(sparks, dt, 0.985); updParticles(dust, dt, 0);
    if (bannerT > 0 && (bannerT -= dt) <= 0) $('banner').classList.remove('show');

    if (state === 'menu') {
      raceT += dt; menuAng += dt * 0.18;
      const k = player, r = 11;
      camera.position.set(k.pos.x + Math.sin(menuAng) * r, k.pos.y + 3.6, k.pos.z + Math.cos(menuAng) * r);
      camera.lookAt(k.pos.x, k.pos.y + 1.1, k.pos.z);
      for (const k2 of karts) syncMesh(k2, dt);
      return;
    }
    if (state === 'results') { raceT += dt; menuAng += dt * 0.25; const k = player; camera.position.set(k.pos.x + Math.sin(menuAng) * 9, k.pos.y + 3, k.pos.z + Math.cos(menuAng) * 9); camera.lookAt(k.pos.x, k.pos.y + 1, k.pos.z); return; }

    if (state === 'countdown') {
      countT += dt;
      const n = Math.floor(countT);
      const txt = countT < 1 ? '' : countT < 2 ? '3' : countT < 3 ? '2' : countT < 4 ? '1' : 'GO!';
      if ($('count').textContent !== txt) {
        $('count').textContent = txt;
        if (txt === '3' || txt === '2' || txt === '1') { sfx.beep(); const l = lights[+txt === 3 ? 0 : +txt === 2 ? 1 : 2]; l.material.color.set('#ff2a1a'); l.material.emissive.set('#ff2a1a'); l.material.emissiveIntensity = 2; }
        if (txt === 'GO!') {
          sfx.go(); lights.forEach(l => { l.material.color.set('#2aff5a'); l.material.emissive.set('#2aff5a'); });
          state = 'race'; startMusic(); updateButtons();
          if (gasEdgeT >= 2.4 && gasEdgeT < 3.3 || isTouch && !keys.brake) { player.boostT = 1.0; sfx.boost(); }
          for (const k of karts) if (!k.isPlayer && Math.random() < 0.5) k.boostT = rand(0.4, 1.0);
          setTimeout(() => { if (state === 'race' || state === 'finish') $('count').textContent = ''; }, 900);
        }
      }
      for (const k of karts) syncMesh(k, dt);
      updateCamera(dt, countT < 0.05);
      computePlaces(); updateHud();
      if (state !== 'race') return;
    }

    raceT += dt;
    if (itemQ) { itemQ = false; if (state === 'race') useItem(player); }
    for (const k of karts) {
      let inp;
      if (k.isPlayer && state === 'race') inp = playerInput();
      else { inp = aiInput(k, dt); if (k.isPlayer || k.finished) k.maxMul = 0.8; }
      updateKart(k, inp, dt);
    }
    kartCollisions(); updateProjectiles(dt); computePlaces();
    for (const k of karts) syncMesh(k, dt);
    updateCamera(dt, false);
    if (state === 'race') {
      updateHud();
      if (player.wrongT > 1.2 && bannerT <= 0) banner('WRONG WAY', true);
    }
    if (state === 'finish' && (finishT += dt) > 3.2) showResults();

    if (engine && AC) {
      const on = state === 'race' ? 1 : 0, sp = Math.abs(player.speed);
      engine.o1.frequency.value = 42 + sp * 3.1 + (player.boostT > 0 ? 25 : 0); engine.o2.frequency.value = engine.o1.frequency.value * 0.5;
      engine.lp.frequency.value = 500 + sp * 30; engine.g.gain.value = on * (0.025 + sp * 0.0012);
      driftN.gain.value = on * (player.drift.on && player.air <= 0 ? 0.05 : 0);
    }
  }

  function frame(t) {
    const dt = Math.min(0.05, (t - (frame.last || t)) / 1000); frame.last = t;
    if (!paused) update(dt);
    const f = player || { pos: new V3() };
    sun.position.set(f.pos.x + SUN_DIR.x * 180, f.pos.y + SUN_DIR.y * 180, f.pos.z + SUN_DIR.z * 180); sun.target.position.copy(f.pos);
    sky.position.copy(camera.position);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  setupRace(); buildMenu(); fitView(); updateButtons();
  requestAnimationFrame(frame);
})();
</script>
