<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meatball Bros.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  :root { color-scheme: dark; --bg: #0b0d17; --ink: #fff4e0; --line: #3a3355; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); overflow: hidden;
         font-family: "Press Start 2P", ui-monospace, Consolas, monospace; }
  #c { position: fixed; inset: 0; display: block; outline: none; touch-action: none; }
  .topbar { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); right: 16px; display: flex; gap: 8px; z-index: 2; }
  .topbar button { background: rgba(11, 13, 23, .7); border: 1px solid var(--line); color: #e8dcc4; font: inherit;
         font-size: 9px; padding: 7px 9px; border-radius: 3px; cursor: pointer; }
  .topbar button:hover { border-color: #f7c33c; color: #fff; }
  button:focus-visible { outline: 2px solid #f7c33c; outline-offset: 2px; }
  .touch { display: none; position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
         justify-content: space-between; align-items: flex-end; padding-inline: 16px; pointer-events: none; z-index: 2; }
  @media (hover: none) and (pointer: coarse) { .touch { display: flex; } }
  .pad { display: flex; gap: 12px; pointer-events: auto; align-items: flex-end; }
  .touch button { width: 66px; height: 66px; border-radius: 50%; border: 2px solid rgba(255, 244, 224, .35);
         background: rgba(255, 244, 224, .08); color: #fff4e0; font: inherit; font-size: 12px;
         touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  .touch button.a { background: rgba(232, 86, 58, .25); border-color: rgba(232, 86, 58, .7); width: 74px; height: 74px; margin-bottom: 18px; }
  .touch button.b { background: rgba(247, 195, 60, .18); border-color: rgba(247, 195, 60, .6); }
  .touch button.on { filter: brightness(1.8); }
</style>

<canvas id="c" tabindex="0" aria-label="Meatball Bros. game. Press Enter to start."></canvas>
<div class="topbar">
  <button id="pauseBtn" type="button" hidden>Pause</button>
  <button id="soundBtn" type="button">Sound on</button>
</div>
<div class="touch">
  <div class="pad">
    <button type="button" data-k="left" aria-label="Move left">◀</button>
    <button type="button" data-k="right" aria-label="Move right">▶</button>
  </div>
  <div class="pad">
    <button type="button" data-k="run" class="b" aria-label="Run and throw">B</button>
    <button type="button" data-k="jump" class="a" aria-label="Jump">A</button>
  </div>
</div>

<script>
(() => {
  const T = 16, ROWS = 15, VH = 240;
  const FONT = '"Press Start 2P", ui-monospace, monospace';
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const buf = document.createElement('canvas'), b = buf.getContext('2d');
  const isTouch = matchMedia('(hover: none) and (pointer: coarse)').matches;
  const pauseBtn = document.getElementById('pauseBtn'), soundBtn = document.getElementById('soundBtn');

  // ---------------- screen ----------------
  let W, H, DPR, S, VW, offX, offY;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    S = Math.min(H / VH, W / 256);
    VW = Math.min(Math.ceil(W / S), 480);
    offX = (W - VW * S) / 2;
    const spare = H - VH * S;
    offY = spare * (H > W ? 0.3 : 0.5);
    buf.width = VW; buf.height = VH;
  }
  addEventListener('resize', resize);
  resize();

  // ---------------- sprites ----------------
  function sprite(rows, pal, h = rows.length, w = 16) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d'), pad = h - rows.length;
    rows.forEach((row, ry) => {
      for (let i = 0; i < w; i++) {
        const ch = row[i];
        if (ch && ch !== '.' && pal[ch]) { x.fillStyle = pal[ch]; x.fillRect(i, ry + pad, 1, 1); }
      }
    });
    return c;
  }

  // Vinny: the steady all-rounder (teal cap, mustache, purple hoodie).
  // Dom: taller, shaggy-haired, floatier jumper with slippery footing (maroon cap, mustard hoodie).
  const VPAL = { c: '#17a7a0', h: '#4a2a14', s: '#f2b98a', k: '#1a1a1a', m: '#4a2a14', p: '#7b4bd1', j: '#2f5fa8', b: '#5a3312' };
  const DPAL = { c: '#9a2438', h: '#3b2414', s: '#e8a877', k: '#1a1a1a', m: '#3b2414', p: '#e0a526', j: '#34344a', b: '#3a2412' };
  const fireOf = pal => ({ ...pal, c: '#ffffff', p: '#ff7a1a', j: '#b8321f' });
  const HERO = {
    v: { name: 'VINNY', note: 'ALL-AROUNDER', col: '#7fe0cc', walk: 1.45, run: 2.5, acc: 1.0, jump: 5.8, grav: 0.25 },
    d: { name: 'DOM', note: 'HIGH JUMPER, SLIPPERY FEET', col: '#f7c33c', walk: 1.4, run: 2.45, acc: 0.8, jump: 6.3, grav: 0.22 }
  };
  const HEAD = [
    '................',
    '.....cccccc.....',
    '....cccccccccc..',
    '....hhhsssks....',
    '...hsshssssss...',
    '...hhsssmmmmm...',
    '.....sssssss....'];
  // Dom's head starts one row higher (he's taller) with shaggy hair spilling out under the cap
  const HEAD_D = [
    '.....cccccc.....',
    '..hhcccccccccc..',
    '.hhhhhhsssks....',
    '.hhhhshssssss...',
    '..hhhhsssmmmm...',
    '..hh.h.ssssss...'];
  const BODY = [
    '....pppppp......',
    '...pppppppp.....',
    '..spppppppps....',
    '..sspppppppss...',
    '....jjjjjjj.....',
    '...jjjjjjjjj....'];
  const JBODY = [
    '....pppppp.ss...',
    '...pppppppppss..',
    '..spppppppp.....',
    '..sspppppppp....',
    '....jjjjjjj.....',
    '...jjjjjjjjj....'];
  const L_STAND = ['...jjjj.jjjj....', '...jjj...jjj....', '..bbbb...bbbb...'];
  const L_W1 = ['..jjjj...jjjj...', '.jjj.......jjj..', 'bbbb........bbbb'];
  const L_W2 = ['....jjjjjjj.....', '.....jjjjj......', '....bbbbbbbb....'];
  const dbl = a => a.flatMap(r => [r, r]);
  const smallRows = (head, body, legs) => [...head, ...body, ...legs];
  const bigRows = (head, body, legs) => ['................', '................', ...head, '.....sssssss....',
    ...dbl(body.slice(0, 4)), '...ppppjjpppp...', '...pppppppppp...', ...dbl(body.slice(4, 6)), ...dbl(legs)];
  // keys: hero (v/d) + power (n/f) + size (s/b) + frame, e.g. 'dnsstand'
  const VF = {};
  for (const [hk, head, base] of [['v', HEAD, VPAL], ['d', HEAD_D, DPAL]])
    for (const [pn, pal] of [['n', base], ['f', fireOf(base)]])
      for (let [fn, body, legs] of [['stand', BODY, L_STAND], ['w1', BODY, L_W1], ['w2', BODY, L_W2], ['jump', JBODY, L_W1]]) {
        if (hk === 'd') legs = [legs[0], ...legs]; // longer legs
        VF[hk + pn + 's' + fn] = sprite(smallRows(head, body, legs), pal, 16);
        VF[hk + pn + 'b' + fn] = sprite(bigRows(head, body, legs), pal, 32);
      }

  const MPAL = { m: '#8a4a2a', M: '#6a3219', r: '#d8321f', w: '#ffffff', k: '#1a1a1a', t: '#e0b07a' };
  const MEAT = [
    '......rrrr......',
    '....rrmmmmrr....',
    '...mmmmmmmmMm...',
    '..mmMmmmmmmmmm..',
    '.mmmmmmmmmmMmmm.',
    '.mmwwkmmmmkwwmm.',
    '.mmwwkmmmmkwwmm.',
    '.mmmmmmmmmmmmmm.',
    '.mMmmkkkkkkmmmm.',
    '..mmmmmmmmmmMm..',
    '...mmmmmmmmmm...',
    '....mmmmmmmm....'];
  const SPR = {
    meat1: sprite([...MEAT, '..tttt....tttt..', '..tttt....tttt..'], MPAL, 16),
    meat2: sprite([...MEAT, '...tttt..tttt...', '...tttt..tttt...'], MPAL, 16),
    meatSquash: sprite(['.....rrrrrr.....', '..mmmmmmmmmmmm..', '.mmwwkmmmmkwwmm.', '.mmmmkkkkkkmmmm.', '..mmmmmmmmmmmm..', '..tttt....tttt..'], MPAL, 16)
  };
  const BPAL = { g: '#3fae4a', G: '#1f6e2a', y: '#f3d36b', w: '#ffffff', k: '#1a1a1a', e: '#f6e7b0' };
  const BUG = [
    '......gggggg....',
    '.....gGgggGgg...',
    '....ggggGgggggg.',
    '..yyggGggggGggg.',
    '.ywkygggGgggggg.',
    '.yyyyggggggGgg..',
    '..yy.eeeeeeeee..'];
  SPR.bug1 = sprite([...BUG, '.....yy....yy...', '....yy....yy....'], BPAL, 16);
  SPR.bug2 = sprite([...BUG, '......yy....yy..', '......yy...yy...'], BPAL, 16);
  SPR.shell = sprite(['......gggggg....', '.....gGgggGgg...', '....ggggGgggggg.', '...ggGggggGgggg.', '...gggGgggggGgg.', '...eeeeeeeeeeee.'], BPAL, 16);
  SPR.cannoli = sprite([
    '...........www..',
    '........nnnwwww.',
    '......nnnnnnww..',
    '....nnnnnNnnk...',
    '..wwnnNnnknn....',
    '.wwwwnnnnN......',
    '..wwwnn.........'], { n: '#e3b271', N: '#b07b3c', w: '#fff8ea', k: '#4a2a14' }, 16);
  SPR.pepper = sprite([
    '......gg........',
    '.....gggg.......',
    '.....rrrr.......',
    '....rrrrrr......',
    '....rWrrrr......',
    '....rWrrrr......',
    '.....rrrrr......',
    '.....rRrrr......',
    '......rrrr......',
    '......rrr.......',
    '.......rr.......',
    '........r.......'], { g: '#2f9e3a', r: '#e3261f', R: '#9e120c', W: '#ff9b8f' }, 16);

  // ---------------- tiles ----------------
  // style: ground look · deco: background props · tr/tempo: music transpose and eighth-note length
  const TH = {
    day: { style: 'grass', deco: 'hills', clouds: true, tr: 1, tempo: 0.2,
      sky: '#78b8ff', skyLow: '#c4e2ff', grass: '#4cc255', grassLight: '#a4ea7f', dirt: '#b06a34', dirtDark: '#7d4521',
      brick: '#c8663b', brickLight: '#e89163', mortar: '#5e2a12', hill: '#46a85a', hillDark: '#2f8445', cloud: '#ffffff', bush: '#3fae4f', bushDark: '#2c8a3d' },
    night: { style: 'grass', deco: 'hills', clouds: true, stars: true, tr: 0.89, tempo: 0.19,
      sky: '#141838', skyLow: '#33306b', grass: '#38a89c', grassLight: '#7fe0cc', dirt: '#5b4378', dirtDark: '#3d2b55',
      brick: '#7c5fd0', brickLight: '#a58cf0', mortar: '#261a4d', hill: '#222b5e', hillDark: '#1a2250', cloud: '#3b4280', bush: '#2a6f73', bushDark: '#1f5558' },
    cellar: { style: 'grass', deco: 'ovens', wall: '#2a180e', tr: 0.84, tempo: 0.22,
      sky: '#1a0f0a', skyLow: '#33200f', grass: '#9a6a44', grassLight: '#c9965f', dirt: '#5a3a28', dirtDark: '#3d2718',
      brick: '#9a4a2a', brickLight: '#c06a3e', mortar: '#2a140a', hill: '#4a2c1c', hillDark: '#2a180e' },
    treetops: { style: 'grass', deco: 'hills', clouds: true, sun: true, tr: 1.12, tempo: 0.18,
      sky: '#ff8f6b', skyLow: '#ffd9a8', grass: '#5bbf4a', grassLight: '#a8ec7a', dirt: '#8d5a3a', dirtDark: '#6a3f26',
      brick: '#c8663b', brickLight: '#e89163', mortar: '#5e2a12', hill: '#b0627f', hillDark: '#8a4865', cloud: '#ffe1ea', bush: '#4a9e45', bushDark: '#357a33' },
    docks: { style: 'planks', deco: 'hills', clouds: true, liquid: '#2f7fd0', liquidLight: '#a8dcff', tr: 1.06, tempo: 0.2,
      sky: '#8fd0ff', skyLow: '#eaf7ff', grass: '#b07a45', grassLight: '#d49a5e', dirt: '#4a2c14', dirtDark: '#6d4222',
      brick: '#c8663b', brickLight: '#e89163', mortar: '#5e2a12', hill: '#79b79a', hillDark: '#5a9a7c', cloud: '#ffffff' },
    castle: { style: 'stone', deco: 'torches', wall: '#1d1822', liquid: '#ff4a12', liquidLight: '#ffd98a', tr: 0.75, tempo: 0.17,
      sky: '#0e0a12', skyLow: '#2a1014', grass: '#6d6a7e', grassLight: '#8f89a0', dirt: '#4d4a5c', dirtDark: '#3a3746',
      brick: '#6a6478', brickLight: '#8f89a0', mortar: '#26222e', hill: '#3a3746', hillDark: '#26222e' }
  };
  function tileCanvas(fn) { const c = document.createElement('canvas'); c.width = c.height = 16; fn(c.getContext('2d')); return c; }
  function R(x, col, a, y, w, h) { x.fillStyle = col; x.fillRect(a, y, w, h); }
  const SPECKS = [[3, 8], [10, 6], [6, 12], [13, 11], [1, 14], [9, 14], [12, 2], [5, 3]];
  const QGLYPH = ['.###.', '#...#', '....#', '...#.', '..#..', '.....', '..#..'];
  function makeTiles(th) {
    const t = {};
    t.grass = tileCanvas(x => { R(x, th.dirt, 0, 0, 16, 16); SPECKS.forEach(([a, y]) => y > 6 && R(x, th.dirtDark, a, y, 2, 1));
      R(x, th.grass, 0, 0, 16, 5); R(x, th.grassLight, 0, 0, 16, 1); for (let i = 0; i < 16; i += 4) R(x, th.grass, i + 1, 5, 2, 1); });
    t.dirt = tileCanvas(x => { R(x, th.dirt, 0, 0, 16, 16); SPECKS.forEach(([a, y]) => R(x, th.dirtDark, a, y, 2, 1)); });
    t.B = tileCanvas(x => { R(x, th.mortar, 0, 0, 16, 16);
      const br = (a, y, w, h) => { R(x, th.brick, a, y, w, h); R(x, th.brickLight, a, y, w, 1); };
      br(0, 1, 7, 6); br(8, 1, 8, 6); br(0, 9, 3, 6); br(4, 9, 8, 6); br(13, 9, 3, 6); });
    const block = (base, glyph) => tileCanvas(x => {
      R(x, '#6b3508', 0, 0, 16, 16); R(x, base, 1, 1, 14, 14); R(x, 'rgba(255,255,255,.45)', 1, 1, 14, 1); R(x, 'rgba(255,255,255,.3)', 1, 1, 1, 14);
      R(x, 'rgba(0,0,0,.25)', 1, 14, 14, 1); [[2, 2], [13, 2], [2, 13], [13, 13]].forEach(([a, y]) => R(x, '#6b3508', a, y, 1, 1));
      if (glyph) QGLYPH.forEach((row, ry) => [...row].forEach((ch, rx) => { if (ch === '#') { R(x, '#6b3508', 6 + rx, 4 + ry, 1, 1); R(x, '#fff3c4', 5 + rx, 3 + ry, 1, 1); } }));
    });
    t.q = [block('#f7c33c', true), block('#e8a91f', true), block('#d8921a', true)];
    t.U = block('#9b6a3f', false);
    t.X = th.style === 'planks'
      ? tileCanvas(x => { R(x, '#5a3518', 0, 0, 16, 16); R(x, '#c08a4e', 1, 1, 14, 14); R(x, '#e0b07a', 1, 1, 14, 1);
          for (let i = 2; i < 14; i++) { R(x, '#8f5e30', i, i, 2, 1); R(x, '#8f5e30', 15 - i, i, 1, 1); } R(x, '#8f5e30', 1, 7, 14, 2); })
      : tileCanvas(x => { R(x, '#4d4a5c', 0, 0, 16, 16); R(x, '#9a97ab', 0, 0, 15, 15); R(x, '#c9c6d8', 0, 0, 15, 1); R(x, '#c9c6d8', 0, 0, 1, 15);
          R(x, '#6d6a7e', 3, 3, 10, 10); R(x, '#8a879b', 4, 4, 8, 8); });
    if (th.style === 'stone') {
      t.grass = t.dirt = tileCanvas(x => { R(x, th.mortar, 0, 0, 16, 16);
        const s = (a, y, w, h) => { R(x, th.brick, a, y, w, h); R(x, th.brickLight, a, y, w, 1); };
        s(0, 0, 7, 7); s(8, 0, 8, 7); s(0, 8, 3, 7); s(4, 8, 8, 7); s(13, 8, 3, 7); });
    } else if (th.style === 'planks') {
      t.grass = tileCanvas(x => { R(x, '#3a2210', 0, 0, 16, 16); R(x, th.grass, 0, 0, 16, 6); R(x, th.grassLight, 0, 0, 16, 1);
        R(x, '#6d4222', 7, 0, 1, 6); R(x, '#6d4222', 0, 6, 16, 1); R(x, '#6d4222', 2, 8, 4, 8); R(x, '#6d4222', 10, 8, 4, 8); });
      t.dirt = tileCanvas(x => { R(x, '#2a1a0c', 0, 0, 16, 16); R(x, '#6d4222', 2, 0, 4, 16); R(x, '#6d4222', 10, 0, 4, 16); R(x, '#8f5e30', 2, 0, 1, 16); R(x, '#8f5e30', 10, 0, 1, 16); });
    }
    t.K = t.B; // unbreakable ceiling bricks
    t.T = tileCanvas(x => { R(x, '#2f7a2f', 0, 0, 16, 16); R(x, '#5bbf4a', 0, 0, 16, 12); R(x, '#a8ec7a', 0, 0, 16, 2);
      [[1, 12], [5, 13], [9, 12], [13, 13]].forEach(([a, y]) => R(x, '#5bbf4a', a, y, 3, 1));
      R(x, '#6b3fa0', 4, 5, 2, 2); R(x, '#6b3fa0', 6, 6, 2, 2); R(x, '#8d5cc4', 11, 4, 2, 2); R(x, '#8d5cc4', 12, 6, 2, 2); });
    const P = '#38b54a', PL = '#9be58a', PD = '#1d6e2c', PO = '#0e3a17';
    t.pq = tileCanvas(x => { R(x, PO, 0, 0, 16, 16); R(x, P, 1, 1, 15, 14); R(x, PL, 3, 1, 3, 14); R(x, PL, 1, 1, 15, 1); });
    t.pw = tileCanvas(x => { R(x, PO, 0, 0, 16, 16); R(x, P, 0, 1, 15, 14); R(x, PD, 10, 1, 4, 14); R(x, PL, 0, 1, 15, 1); });
    t.pe = tileCanvas(x => { R(x, PO, 2, 0, 14, 16); R(x, P, 3, 0, 13, 16); R(x, PL, 5, 0, 3, 16); });
    t.pr = tileCanvas(x => { R(x, PO, 0, 0, 14, 16); R(x, P, 0, 0, 13, 16); R(x, PD, 8, 0, 4, 16); });
    return t;
  }
  const TILES = Object.fromEntries(Object.entries(TH).map(([k, v]) => [k, makeTiles(v)]));
  const SOLID = new Set(['G', 'B', '?', 'M', 'C', 'U', 'X', 'q', 'w', 'e', 'r', 'T', 'K']);

  // ---------------- levels ----------------
  const LEVELS = [
    { name: '1-1', title: 'MEATBALL MEADOWS', theme: 'day', len: 200, flag: 191, castle: 194, check: 95,
      enemies: [['g', 22], ['g', 40], ['g', 51], ['g', 53], ['k', 62], ['g', 81, 4], ['g', 84, 4], ['g', 97], ['g', 99], ['k', 107],
        ['g', 114], ['g', 116], ['g', 124], ['g', 126], ['g', 130], ['g', 132], ['g', 164], ['g', 166]],
      build(a) {
        a.ground(0, 68); a.ground(71, 85); a.ground(89, 150); a.ground(153, 199);
        a.blocks(16, 9, '?'); a.blocks(20, 9, 'BMB?B'); a.blocks(22, 5, '?');
        a.pipe(28, 2); a.pipe(38, 3); a.pipe(46, 4); a.pipe(57, 4);
        a.blocks(64, 9, 'B?B'); a.coins(64, 7, 3);
        a.blocks(77, 9, 'BMB'); a.blocks(80, 5, 'BBBBBBBB'); a.coins(86, 8, 3);
        a.blocks(91, 5, 'BBB?'); a.blocks(94, 9, 'C');
        a.blocks(100, 9, 'BB'); a.blocks(106, 9, '?'); a.blocks(109, 9, '?'); a.blocks(109, 5, 'M'); a.blocks(112, 9, '?');
        a.blocks(118, 9, 'B'); a.blocks(121, 5, 'BBB'); a.blocks(128, 5, 'B??B'); a.blocks(129, 9, 'BB');
        a.up(134, 4); a.down(140, 4);
        a.up(146, 4); a.col(150, 4); a.down(153, 4);
        a.pipe(158, 2); a.blocks(162, 9, 'BB?B'); a.pipe(170, 2);
        a.up(174, 8); a.col(182, 8);
      } },
    { name: '1-2', title: 'MOONLIT ROOFTOPS', theme: 'night', len: 190, flag: 175, castle: 178, check: 90,
      enemies: [['g', 16], ['k', 30], ['g', 35], ['g', 37], ['g', 58], ['g', 60], ['k', 67], ['g', 86, 8], ['g', 88, 8], ['g', 92], ['g', 94],
        ['g', 113], ['g', 115], ['k', 124], ['g', 128], ['g', 142], ['g', 144], ['k', 150], ['g', 152], ['g', 154]],
      build(a) {
        a.ground(0, 20); a.ground(24, 40); a.ground(49, 70); a.ground(74, 100); a.ground(105, 130); a.ground(134, 189);
        a.blocks(10, 9, '?B?'); a.coins(21, 10, 3);
        a.blocks(28, 9, '?B?'); a.blocks(29, 5, 'M');
        a.blocks(43, 10, 'BBBB'); a.coins(43, 8, 4);
        a.pipe(55, 3); a.pipe(63, 2);
        a.up(76, 3); a.blocks(84, 9, 'BBBBB'); a.blocks(85, 5, '?C?');
        a.blocks(102, 11, 'XX'); a.coins(101, 8, 4);
        a.pipe(110, 4); a.pipe(118, 3); a.blocks(122, 9, 'B?BMB');
        a.coins(136, 8, 6); a.blocks(138, 9, 'B?B?B'); a.blocks(146, 5, 'BCB');
        a.up(158, 8); a.col(166, 8);
      } },
    { name: '1-3', title: 'PIZZA CELLAR', theme: 'cellar', len: 190, flag: 176, castle: 179, check: 88,
      enemies: [['g', 22], ['g', 24], ['g', 34], ['k', 38], ['g', 52], ['g', 55], ['g', 61], ['g', 86], ['g', 95], ['g', 97], ['k', 106],

        if (a.state === 'slide' && e.state !== 'slide') { flipKill(e, a.dir); chainScore(a.chain++, e.x, e.y); }
        else if (e.state === 'slide' && a.state !== 'slide') { flipKill(a, e.dir); chainScore(e.chain++, a.x, a.y); }
        else if (a.state === 'slide' && e.state === 'slide') { flipKill(a, -1); flipKill(e, 1); }
        else if (a.state === 'walk' && e.state === 'walk') { a.dir = a.x < e.x ? -1 : 1; e.dir = -a.dir; }
        else if (a.state === 'walk') a.dir *= -1; else if (e.state === 'walk') e.dir *= -1;

    }

      if (!e.active || e.state === 'flip' || e.state === 'squash' || !overlap(P, e)) continue;
      const fromAbove = P.vy > 0 && P.y + P.h - P.vy <= e.y + 5;
      if (e.kind === 'f') { hurt(); if (state !== 'play') return; continue; }
      if (e.kind === 'boss') {
        if (fromAbove) {
          P.vy = -6.5;
          if (e.hitT === 0) { e.hp--; e.hitT = 50; sfx.stomp(); sfx.bump(); addScore(1000, e.x, e.y); if (e.hp <= 0) bossDown(e); }
        } else if (e.hitT === 0) hurt();
        if (state !== 'play') return;
        continue;
      }
      if (e.state === 'walk') {
        if (fromAbove) {
          if (e.kind === 'g') { e.state = 'squash'; e.t = 30; } else { e.state = 'shell'; e.t = 420; e.chain = 0; }
          P.vy = keys.jump ? -6 : -4; sfx.stomp(); chainScore(P.combo++, e.x, e.y);
        } else hurt();
      } else if (e.state === 'shell') {
        e.state = 'slide'; e.dir = (P.x + P.w / 2 < e.x + e.w / 2) ? 1 : -1; e.kickGrace = 12; e.chain = 0;
        sfx.kick(); addScore(400, e.x, e.y); if (fromAbove) P.vy = -4;
      } else if (e.state === 'slide') {
        if (fromAbove) { e.state = 'shell'; e.t = 420; P.vy = -4; sfx.stomp(); addScore(100, e.x, e.y); }

      if (it.emerge > 0) { it.y -= 0.5; if (--it.emerge === 0 && it.kind === 'cannoli') it.vx = 1; continue; }

        else if (it.kind === 'pepper' && !P.fire) { freezeFrom = 'nofire'; P.fire = true; freezeT = 30; sfx.power(); addScore(1000, it.x, it.y); }

    }
  }

  function updatePlayer() {
    const hs = HERO[hero], run = keys.run, max = run ? hs.run : hs.walk, acc = (P.onG ? (run ? 0.085 : 0.06) : 0.05) * hs.acc;
    P.skid = false;
    if (keys.left && !keys.right) { if (P.vx > 0 && P.onG) { P.vx -= 0.18; P.skid = true; } else P.vx -= acc; P.face = -1; }
    else if (keys.right && !keys.left) { if (P.vx < 0 && P.onG) { P.vx += 0.18; P.skid = true; } else P.vx += acc; P.face = 1; }
    else if (P.onG) { P.vx = Math.abs(P.vx) < 0.07 ? 0 : P.vx - Math.sign(P.vx) * 0.07; }
    if (Math.abs(P.vx) > max) P.vx = Math.sign(P.vx) * Math.max(max, Math.abs(P.vx) - 0.04);

    if (P.onG) { P.coyote = 6; P.combo = 0; } else if (P.coyote > 0) P.coyote--;
    if (jumpBuf > 0) jumpBuf--;

    if (fireQ) {

    }

    moveX(P);
    if (P.x < cx) { P.x = cx; if (P.vx < 0) P.vx = 0; }
    const head = moveY(P, true);
    if (head) hitBlock(head.c, head.r);
    if (P.inv > 0) P.inv--;
    P.anim += Math.abs(P.vx) * 0.11;

    // loose coins
    const c0 = Math.floor(P.x / T), c1 = Math.floor((P.x + P.w - 0.001) / T), r0 = Math.floor(P.y / T), r1 = Math.floor((P.y + P.h - 0.001) / T);
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (tileAt(c, r) === 'o') { grid[r][c] = '.'; addCoin(); }

  }

  function updateEnemy(e) {
    if (e.state === 'flip') { e.vy += 0.3; e.y += e.vy; e.x += e.vx; if (e.y > VH + 32) e.remove = true; return; }
    if (e.kind === 'f') { // lava spark: leaps out of the lava, falls back, waits
      if (e.t > 0) { if (--e.t === 0) { e.y = VH; e.vy = -7.4; } return; }
      e.vy += 0.2; e.y += e.vy;
      if (e.vy > 0 && e.y > VH + 4) { e.t = 60 + (Math.random() * 90 | 0); e.y = VH + 40; }
      return;
    }
    if (e.kind === 'boss') { updateBoss(e); return; }
    if (e.state === 'squash') { if (--e.t <= 0) e.remove = true; return; }
    const speed = e.state === 'slide' ? 3.6 : e.state === 'shell' ? 0 : 0.5;
    e.vx = e.dir * speed; e.vy = Math.min(e.vy + 0.4, 5);
    if (moveX(e)) { e.dir *= -1; if (e.state === 'slide' && e.x > cx - 16 && e.x < cx + VW) sfx.bump(); }
    moveY(e);
    if (e.y > VH + 16) e.remove = true;

  }

  // The Meatball King: paces his hall, hops, and spits out meatballs. 3 stomps (or 12 fireballs).
  function updateBoss(e) {
    if (e.hitT > 0) e.hitT--;
    e.anim += 0.06;
    const pc = P.x + P.w / 2, ec = e.x + e.w / 2, angry = e.hp <= 1;
    if (e.onG && --e.hopT <= 0) { e.vy = angry ? -7 : -6; e.hopT = 70 + (Math.random() * 80 | 0); }
    if (e.onG && Math.random() < 0.015) e.dir = pc < ec ? -1 : 1;
    e.vx = e.dir * (angry ? 1.1 : 0.7);
    e.vy = Math.min(e.vy + 0.35, 6);
    if (moveX(e)) e.dir *= -1;
    if (e.x < e.home - 9 * T && e.dir < 0) e.dir = 1;
    moveY(e);
    if (--e.spitT <= 0) {
      e.spitT = angry ? 110 : 170;
      if (enemies.filter(m => m.kind === 'g' && m.active && m.state === 'walk').length < 3) {
        const m = makeEnemy('g', 0); m.x = ec - 7; m.y = e.y + 4; m.dir = pc < ec ? -1 : 1; m.vy = -4; m.active = true;
        enemies.push(m); sfx.kick();
      }
    }
  }
  function bossDown(e) {
    flipKill(e, 1); addScore(5000, e.x, e.y); doBoom();

    bossWinT = 150; P.inv = 0;
  }
  function doBoom() { sfx.brk(); setTimeout(sfx.brk, 150); setTimeout(sfx.brk, 300); }

  function hurt() {
    if (P.inv > 0) return;
    if (P.big) { freezeFrom = 'big'; setBig(false); freezeT = 30; P.inv = 120; sfx.hurt(); }
    else die(false);
  }

  function die(fell) {
    if (state === 'dying') return;
    state = 'dying'; P.dyT = 0; P.fell = fell; P.vy = 0; P.vx = 0;
    if (P.big) setBig(false);
    stopMusic(); sfx.die(); updateButtons();
  }

  function updateDying() {
    P.dyT++;
    if (!P.fell) { if (P.dyT === 30) P.vy = -5.5; if (P.dyT > 30) { P.vy += 0.25; P.y += P.vy; } }
    if (P.dyT > 170) {

      if (lives <= 0) { gameEnd('over'); return; }
      loadLevel(levelIdx, hasCheck); state = 'intro'; introT = 0; updateButtons();
    }
  }

  function startFlag(fx) {
    state = 'flag'; stopMusic(); sfx.flag(); updateButtons();
    const hgt = 13 * T - (P.y + P.h);
    const pts = hgt >= 128 ? 5000 : hgt >= 96 ? 2000 : hgt >= 64 ? 800 : hgt >= 32 ? 400 : 100;
    addScore(pts, fx + 4, P.y);
    P.vx = 0; P.vy = 0; P.x = fx - P.w + 1; P.face = 1;
    fl = { phase: 'slide', hold: 0, wait: 0, fx };
  }

  function updateFlag() {
    const base = 12 * T;
    if (fl.phase === 'slide') {
      if (P.y + P.h < base) P.y = Math.min(P.y + 2.2, base - P.h);
      if (flagY < base - 12) flagY = Math.min(flagY + 2.2, base - 12);

    } else if (fl.phase === 'walk') {

    } else if (fl.phase === 'tally') {
      if (time > 0) { const d = Math.min(2, time); time -= d; score += 50 * d; if (tick % 4 === 0) sfx.tick(); }
      else if (++fl.wait > 90) {

      }
    }
  }

  function gameEnd(s) {
    state = s; endT = 0; stopMusic();
    if (score > top) { top = score; try { localStorage.setItem('meatball-top', String(top)); } catch (e) {} }

  }

  // ---------------- drawing ----------------
  let textQ = [];
  function txt(s, x, y, o = {}) { textQ.push({ s, x, y, col: o.col || '#fff4e0', align: o.align || 'left', size: o.size || 8, shadow: o.shadow !== false }); }
  function flushText() {
    ctx.textBaseline = 'top';
    for (const t of textQ) {
      const px = (offX + t.x * S) * DPR, py = (offY + t.y * S) * DPR, sz = t.size * S * DPR;
      ctx.font = `${sz}px ${FONT}`; ctx.textAlign = t.align;
      if (t.shadow) { ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillText(t.s, px + sz * 0.12, py + sz * 0.12); }
      ctx.fillStyle = t.col; ctx.fillText(t.s, px, py);

  }

  function spr(img, x, y, flipX, flipY) {
    x = Math.round(x); y = Math.round(y);
    if (!flipX && !flipY) { b.drawImage(img, x, y); return; }
    b.save(); b.translate(x + (flipX ? img.width : 0), y + (flipY ? img.height : 0)); b.scale(flipX ? -1 : 1, flipY ? -1 : 1); b.drawImage(img, 0, 0); b.restore();
  }

    b.fillStyle = '#f7c33c'; b.fillRect(x + 8 - w / 2, y + 2, w, 12);

  }
  function brickRect(x, y, w, h) {
    b.fillStyle = th.mortar; b.fillRect(x, y, w, h); b.fillStyle = th.brick;
    for (let yy = 0; yy < h; yy += 8) {
      const off = (yy / 8) % 2 ? 4 : 0;

  function drawWorld() {
    const camX = Math.round(cx);

    b.fillStyle = g; b.fillRect(0, 0, VW, VH);

    if (th.wall) { // brick wall backdrop for indoor levels

      for (let y = 0; y < VH; y += 8) { b.fillRect(0, y, VW, 1); for (let x = ox + ((y / 8) % 2) * 8 - 16; x < VW; x += 16) b.fillRect(x, y, 1, 8); }
    }
    if (th.sun) {
      b.fillStyle = 'rgba(255,236,170,.35)'; b.beginPath(); b.arc(VW * 0.7, 150, 44, 0, Math.PI * 2); b.fill();
      b.fillStyle = '#ffe9a6'; b.beginPath(); b.arc(VW * 0.7, 150, 32, 0, Math.PI * 2); b.fill();
    }
    if (th.stars) {
      for (const s of nightStars) {
        const sx = ((s.x - camX * 0.1) % 900 + 900) % 900;
        if (sx > VW) continue;
        b.fillStyle = `rgba(255,255,240,${0.35 + 0.35 * Math.sin(tick * 0.05 + s.p)})`; b.fillRect(sx, s.y, 1, 1);
      }
      b.fillStyle = '#fff5cf'; b.beginPath(); b.arc(VW * 0.78, 42, 14, 0, Math.PI * 2); b.fill();
      b.fillStyle = th.sky; b.beginPath(); b.arc(VW * 0.78 + 6, 38, 12, 0, Math.PI * 2); b.fill();
    }
    if (th.clouds) for (const c of clouds) {
      const sx = c.x - camX * 0.3; if (sx < -80 || sx > VW + 20) continue;
      b.fillStyle = th.cloud;
      for (let i = 0; i < c.n; i++) { b.beginPath(); b.arc(sx + 10 + i * 14, c.y, 9, 0, Math.PI * 2); b.fill(); }
      b.beginPath(); b.arc(sx + 3 + c.n * 7, c.y - 7, 10, 0, Math.PI * 2); b.fill();
      b.fillRect(sx + 4, c.y, c.n * 14 + 8, 8);

      if (th.deco === 'hills') {

        b.fillStyle = th.hillDark; b.fillRect(sx - 6, 13 * T - h.rad * 0.6, 3, 6); b.fillRect(sx + 7, 13 * T - h.rad * 0.4, 3, 6);
      } else if (th.deco === 'ovens') { // brick pizza ovens glowing in the dark

        b.fillStyle = th.brick; b.fillRect(sx - 4, gy - 64, 8, 20);

        b.fillStyle = '#ffe9a6'; b.fillRect(sx - 6, gy - 6, 12, 3);
      } else if (th.deco === 'torches') {

        const fl2 = Math.sin(tick * 0.3 + h.x) > 0;

    }

      b.fillStyle = th.liquidLight;
      const wob = Math.floor(tick / 20) % 2;
      for (let x = -((camX + tick * 0.4) % 16); x < VW; x += 16) b.fillRect(x, y0 + wob, 6, 1);
      for (let x = -((camX * 0.8) % 24) + 8; x < VW; x += 24) b.fillRect(x, y0 + 8 - wob, 4, 1);
    }
    b.save(); b.translate(-camX, 0);
    for (const tr of trunks) {

      b.fillStyle = '#6b4226'; b.fillRect(tr.x + 3, tr.y, 10, VH - tr.y);
      b.fillStyle = '#4e2f1a'; b.fillRect(tr.x + 9, tr.y, 2, VH - tr.y);
    }
    if (th.bush) for (const s of bushes) {

      b.fillStyle = th.bush;
      for (let i = 0; i <= s.n; i++) { b.beginPath(); b.arc(s.x + 8 + i * 12, 13 * T, 9, Math.PI, 0); b.fill(); }
      b.fillStyle = th.bushDark; b.fillRect(s.x + 2, 13 * T - 2, s.n * 12 + 12, 2);
    }
    // castle
    const kx = def.castle * T, ky = 13 * T;
    if (def.castle && kx < camX + VW && kx + 80 > camX) {
      brickRect(kx, ky - 48, 80, 48);
      for (let i = 0; i < 5; i++) brickRect(kx + i * 16 + 4, ky - 56, 8, 8);
      brickRect(kx + 16, ky - 88, 48, 32);
      for (let i = 0; i < 3; i++) brickRect(kx + 16 + i * 16 + 4, ky - 96, 8, 8);
      b.fillStyle = '#120a06'; b.fillRect(kx + 32, ky - 22, 16, 22); b.beginPath(); b.arc(kx + 40, ky - 22, 8, Math.PI, 0); b.fill();
      b.fillRect(kx + 24, ky - 80, 6, 10); b.fillRect(kx + 50, ky - 80, 6, 10);
    }

    for (const it of items) if (it.emerge > 0) spr(SPR[it.kind], it.x, it.y);
    // tiles
    const c0 = Math.max(0, Math.floor(camX / T)), c1 = Math.min(LEN - 1, Math.floor((camX + VW) / T));
    const qf = [0, 0, 0, 1, 2, 1][Math.floor(tick / 9) % 6];
    for (let r = 0; r < ROWS; r++) for (let c = c0; c <= c1; c++) {
      const t = grid[r][c]; if (t === '.') continue;
      const x = c * T; let y = r * T;
      const bv = bumps.get(c + ',' + r); if (bv !== undefined) y -= Math.round(Math.sin(bv / 10 * Math.PI) * 5);
      switch (t) {
        case 'G': b.drawImage(tileAt(c, r - 1) === 'G' ? tiles.dirt : tiles.grass, x, y); break;
        case 'B': case 'C': case 'K': b.drawImage(tiles.B, x, y); break;

      b.fillStyle = '#2fbf5a'; b.beginPath(); b.arc(fx + 1, 2 * T + 6, 4, 0, Math.PI * 2); b.fill();
      b.fillStyle = '#17a7a0'; b.beginPath(); b.moveTo(fx, flagY); b.lineTo(fx - 16, flagY + 6); b.lineTo(fx, flagY + 12); b.fill();
      b.fillStyle = '#fff4e0'; b.fillRect(fx - 8, flagY + 4, 2, 2); b.fillRect(fx - 6, flagY + 6, 2, 2); b.fillRect(fx - 4, flagY + 4, 2, 2);
    }
    // items
    for (const it of items) {
      if (it.emerge > 0) continue;
      if (it.kind === 'coinpop') drawCoin(it.x, it.y, Math.floor(it.t / 3));
      else spr(SPR[it.kind], it.x, it.y + (it.kind === 'pepper' ? Math.round(Math.sin(tick * 0.1)) : 0));
    }
    // enemies
    for (const e of enemies) {
      if (!e.active || e.x > camX + VW + 16) continue;
      const dx = e.x - 1, dy = e.y + e.h - 16, flipY = e.state === 'flip';
      if (e.kind === 'f') {
        if (e.t > 0) continue;
        const cxf = e.x + 6, cyf = e.y + 6, fk = tick % 6 < 3;
        b.fillStyle = '#ff4a12'; b.beginPath(); b.arc(cxf, cyf, 6, 0, Math.PI * 2); b.fill();
        b.fillStyle = '#ffb347'; b.beginPath(); b.arc(cxf, cyf + (e.vy < 0 ? 1 : -1), fk ? 4 : 3, 0, Math.PI * 2); b.fill();
        b.fillStyle = '#1a0a04'; b.fillRect(cxf - 3, cyf - 1, 2, 2); b.fillRect(cxf + 1, cyf - 1, 2, 2);
        continue;
      }
      if (e.kind === 'boss') {
        if (e.hitT > 0 && tick % 6 < 3) continue;
        b.save(); b.translate(Math.round(e.x - 2), Math.round(flipY ? e.y + e.h + 4 : e.y - 4)); b.scale(2, flipY ? -2 : 2);
        b.drawImage(Math.floor(e.anim) % 2 ? SPR.meat2 : SPR.meat1, 0, 0); b.restore();
        if (!flipY) { // crown
          const kx2 = Math.round(e.x + 6), ky2 = Math.round(e.y - 8);
          b.fillStyle = '#f7c33c'; b.fillRect(kx2, ky2 + 4, 16, 4); b.fillRect(kx2, ky2, 3, 4); b.fillRect(kx2 + 6, ky2 - 1, 4, 5); b.fillRect(kx2 + 13, ky2, 3, 4);
          b.fillStyle = '#e8563a'; b.fillRect(kx2 + 7, ky2 + 5, 2, 2);
        }
        continue;
      }
      if (e.kind === 'g') spr(e.state === 'squash' ? SPR.meatSquash : (Math.floor(e.anim) % 2 ? SPR.meat2 : SPR.meat1), dx, dy, false, flipY);
      else if (e.state === 'walk') spr(Math.floor(e.anim) % 2 ? SPR.bug2 : SPR.bug1, dx, dy, e.dir > 0, flipY);
      else {
        const wob = e.state === 'shell' && e.t < 90 && tick % 8 < 4 ? 1 : 0;
        spr(SPR.shell, dx + wob, dy, false, flipY);
      }
    }
    // fireballs
    for (const f of fireballs) {
      b.fillStyle = '#ff5a1f'; b.beginPath(); b.arc(f.x + 4, f.y + 4, 4, 0, Math.PI * 2); b.fill();
      b.fillStyle = '#ffd98a'; const a = tick * 0.5; b.fillRect(f.x + 3 + Math.cos(a) * 2, f.y + 3 + Math.sin(a) * 2, 2, 2);
    }
    // player
    drawPlayer();
    // pieces & puffs
    for (const p of pieces) {
      if (p.puff) { b.fillStyle = 'rgba(255,255,255,.7)'; b.beginPath(); b.arc(p.x + 4, p.y + 4, 4, 0, Math.PI * 2); b.fill(); p.y = VH + 99; continue; }
      b.fillStyle = th.brick; b.fillRect(p.x, p.y, 6, 6); b.fillStyle = th.mortar; b.fillRect(p.x + 4, p.y, 2, 6);
    }
    b.restore();
    for (const p of popups) txt(p.text, p.x - camX, p.y, { size: 6 });
  }

  function drawPlayer() {
    if (P.hidden || state === 'title' && false) return;
    if (P.inv > 0 && tick % 4 < 2) return;
    let big = P.big, fire = P.fire;
    if (freezeT > 0 && Math.floor(freezeT / 4) % 2) { if (freezeFrom === 'small') big = false; else if (freezeFrom === 'big') big = true; else if (freezeFrom === 'nofire') fire = false; }
    let fr = 'stand';
    if (state === 'dying') fr = 'jump';
    else if (!P.onG && state !== 'flag') fr = 'jump';
    else if (state === 'flag' && fl && fl.phase === 'slide') fr = 'jump';
    else if (Math.abs(P.vx) > 0.1 || (state === 'flag')) fr = Math.floor(P.anim) % 2 ? 'w2' : 'w1';
    if (P.skid) fr = 'w2';
    const img = VF[hero + (fire && big ? 'f' : 'n') + (big ? 'b' : 's') + fr];
    const faceLeft = P.skid ? P.face > 0 : P.face < 0;
    spr(img, P.x - 2, P.y + P.h - img.height, faceLeft, false);
    if (state === 'title') { // the other brother waits beside him
      const other = VF[(hero === 'v' ? 'd' : 'v') + 'nsstand'];
      spr(other, P.x + 18, 13 * T - 16, true, false);
    }
  }

  function drawHud() {
    const cols = [8, VW * 0.3, VW * 0.54, VW * 0.8];
    txt(HERO[hero].name, cols[0], 8); txt(String(score).padStart(6, '0'), cols[0], 18);
    drawCoinIcon(cols[1], 16); txt('x' + String(coins).padStart(2, '0'), cols[1] + 10, 18);
    txt('WORLD', cols[2], 8); txt(def.name, cols[2] + 8, 18);
    txt('TIME', cols[3], 8); if (state !== 'intro') txt(String(time).padStart(3, '0'), cols[3] + 4, 18, { col: time <= 100 ? '#ff9b8f' : '#fff4e0' });
    const boss = state === 'play' && enemies.find(e => e.kind === 'boss' && e.active && e.state !== 'flip');
    if (boss) {
      txt('MEATBALL KING', VW / 2, 34, { align: 'center', size: 6, col: '#f7c33c' });
      for (let i = 0; i < 3; i++) {
        const fill = Math.max(0, Math.min(1, boss.hp - i)), x0 = Math.round(VW / 2 - 25 + i * 18);
        b.fillStyle = '#3a1a10'; b.fillRect(x0, 44, 14, 6);
        b.fillStyle = '#e8563a'; b.fillRect(x0 + 1, 45, Math.round(12 * fill), 4);
      }
    }
  }
  function drawCoinIcon(x, y) { b.fillStyle = '#9a5d0f'; b.fillRect(x, y + 1, 7, 10); b.fillStyle = '#f7c33c'; b.fillRect(x + 1, y + 2, 5, 8); b.fillStyle = '#fff2b0'; b.fillRect(x + 2, y + 3, 1, 5); }

  function panel(x, y, w, h) {
    b.fillStyle = 'rgba(8,6,14,.82)'; b.fillRect(x, y, w, h);
    b.fillStyle = '#c8663b'; b.fillRect(x, y, w, 2); b.fillRect(x, y + h - 2, w, 2); b.fillRect(x, y, 2, h); b.fillRect(x + w - 2, y, 2, h);
    b.fillStyle = '#f7c33c'; [[x + 4, y + 4], [x + w - 6, y + 4], [x + 4, y + h - 6], [x + w - 6, y + h - 6]].forEach(([a, c]) => b.fillRect(a, c, 2, 2));
  }

  function draw() {
    b.imageSmoothingEnabled = false;
    const blink = Math.floor(tick / 30) % 2 === 0;
    if (state === 'intro' || state === 'over') {
      b.fillStyle = '#000'; b.fillRect(0, 0, VW, VH);
      drawHud();
      if (state === 'intro') {
        txt('WORLD ' + def.name, VW / 2, 84, { align: 'center' });
        txt(def.title, VW / 2, 100, { align: 'center', size: 6, col: '#f7c33c' });
        b.drawImage(VF[hero + 'nsstand'], Math.round(VW / 2 - 26), 124);
        txt('x  ' + lives, VW / 2 - 2, 128);
      } else {
        txt('GAME OVER', VW / 2, 96, { align: 'center', col: '#ff9b8f' });
        txt('SCORE ' + String(score).padStart(6, '0'), VW / 2, 118, { align: 'center', size: 6 });
        if (endT > 60 && blink) txt((isTouch ? 'TAP' : 'PRESS ENTER') + ' TO CONTINUE FROM ' + def.name, VW / 2, 150, { align: 'center', size: 6 });
      }
    } else {
      drawWorld();
      if (state !== 'title') drawHud();
    }

    if (state === 'title') {
      const pw = Math.min(232, VW - 16), px = Math.round((VW - pw) / 2);
      panel(px, 28, pw, 150);
      const hs = HERO[hero];
      txt('MEATBALL', VW / 2, 36, { align: 'center', size: 16, col: '#f7c33c' });
      txt('BROS.', VW / 2, 54, { align: 'center', size: 16, col: '#e8563a' });
      txt('< ' + hs.name + ' >', VW / 2, 76, { align: 'center', size: 8, col: hs.col });
      txt(hs.note, VW / 2, 87, { align: 'center', size: 6, col: '#e8dcc4' });
      if (blink) txt(isTouch ? 'TAP A TO START' : 'PRESS ENTER', VW / 2, 102, { align: 'center' });
      const lines = isTouch ? ['LEFT/RIGHT  PICK BROTHER', 'A  JUMP', 'HOLD B  RUN', 'TAP B  THROW (WITH PEPPER)']
        : ['LEFT/RIGHT  PICK BROTHER', 'Z/SPACE/UP  JUMP', 'HOLD X/SHIFT  RUN', 'TAP X/SHIFT  THROW (PEPPER)', 'P PAUSE   M SOUND'];
      lines.forEach((l, i) => txt(l, VW / 2, 118 + i * 9, { align: 'center', size: 6, col: '#e8dcc4' }));
      txt('TOP ' + String(top).padStart(6, '0'), VW / 2, 186, { align: 'center', size: 6 });
    }
    if (state === 'win') {
      const pw = Math.min(232, VW - 16), px = Math.round((VW - pw) / 2);
      panel(px, 50, pw, 130);
      txt('YOU DID IT,', VW / 2, 66, { align: 'center', col: '#f7c33c' });
      txt(HERO[hero].name + '!', VW / 2, 80, { align: 'center', col: '#f7c33c' });
      txt('THE MEATBALL KING IS DONE', VW / 2, 98, { align: 'center', size: 6 });
      txt("NONNA'S RECIPE IS SAFE!", VW / 2, 108, { align: 'center', size: 6, col: '#7fe0cc' });
      txt('SCORE ' + String(score).padStart(6, '0'), VW / 2, 120, { align: 'center', size: 6 });
      txt('TOP   ' + String(top).padStart(6, '0'), VW / 2, 132, { align: 'center', size: 6 });
      if (endT > 60 && blink) txt(isTouch ? 'TAP TO CONTINUE' : 'PRESS ENTER', VW / 2, 158, { align: 'center', size: 6 });
    }
    if (paused) {
      b.fillStyle = 'rgba(0,0,0,.5)'; b.fillRect(0, 0, VW, VH);
      txt('PAUSED', VW / 2, 104, { align: 'center' });
      txt(isTouch ? 'TAP TO RESUME' : 'PRESS P TO RESUME', VW / 2, 120, { align: 'center', size: 6 });
    }

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#0b0d17'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(buf, 0, 0, VW, VH, Math.round(offX * DPR), Math.round(offY * DPR), Math.round(VW * S * DPR), Math.round(VH * S * DPR));
    flushText();
  }

  // ---------------- input ----------------
  function handleStart() {
    if (state === 'title') newGame();
    else if (state === 'over' && endT > 60) { // continue from the level you reached
      score = 0; coins = 0; lives = 3; setBig(false); P.fire = false;
      loadLevel(levelIdx, false); state = 'intro'; introT = 0; updateButtons();
    }
    else if (state === 'win' && endT > 60) { state = 'title'; loadLevel(0, false); setBig(false); P.x = 3 * T + 2; P.y = 13 * T - P.h; updateButtons(); }
  }
  function canPause() { return state === 'play' || state === 'flag'; }
  function togglePause() {
    if (!canPause() && !paused) return;
    paused = !paused;
    for (const k in keys) keys[k] = false;
    if (AC) { paused ? AC.suspend() : AC.resume(); }
    updateButtons();
  }
  function toggleMute() { muted = !muted; applyGain(); updateButtons(); try { localStorage.setItem('meatball-muted', muted ? '1' : '0'); } catch (e) {} }
  function updateButtons() {
    pauseBtn.hidden = !(canPause() || paused);
    pauseBtn.textContent = paused ? 'Resume' : 'Pause';
    soundBtn.textContent = muted ? 'Sound off' : 'Sound on';
  }
  function press(k) {
    if (k === 'jump' && !keys.jump) jumpBuf = 7;
    if (k === 'run' && !keys.run) fireQ = true;
    keys[k] = true;
  }

  const KM = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', Space: 'jump', ArrowUp: 'jump', KeyW: 'jump', KeyZ: 'jump', KeyK: 'jump',
    ShiftLeft: 'run', ShiftRight: 'run', KeyX: 'run', KeyJ: 'run' };
  addEventListener('keydown', e => {
    initAudio();
    if (e.target && e.target.tagName === 'BUTTON' && (e.code === 'Enter' || e.code === 'Space')) return;
    if ((e.code === 'Enter' || e.code === 'Space') && (state === 'title' || state === 'over' || state === 'win')) { e.preventDefault(); handleStart(); return; }
    if (e.code === 'KeyP' || e.code === 'Escape' || (e.code === 'Enter' && (canPause() || paused))) { togglePause(); return; }
    if (e.code === 'KeyM') { toggleMute(); return; }
    const k = KM[e.code];
    if (state === 'title' && (k === 'left' || k === 'right')) { e.preventDefault(); if (!e.repeat) swapHero(); return; }
    if (k) { e.preventDefault(); if (!paused) press(k); }
  });
  addEventListener('keyup', e => { const k = KM[e.code]; if (k) keys[k] = false; });
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (canPause() && !paused) togglePause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && canPause() && !paused) togglePause(); });

  cv.addEventListener('pointerdown', () => {
    initAudio(); cv.focus();
    if (paused) togglePause(); else if (state === 'title' || state === 'over' || state === 'win') handleStart();
  });
  pauseBtn.addEventListener('click', () => { initAudio(); togglePause(); cv.focus(); });
  soundBtn.addEventListener('click', () => { initAudio(); toggleMute(); cv.focus(); });
  document.querySelectorAll('.touch button').forEach(btn => {
    const k = btn.dataset.k;
    btn.addEventListener('pointerdown', e => {
      e.preventDefault(); initAudio(); btn.classList.add('on');
      if (paused) { togglePause(); return; }
      if (state === 'title' && (k === 'left' || k === 'right')) { swapHero(); return; }
      if (state === 'title' || state === 'over' || state === 'win') { handleStart(); return; }
      press(k);
    });
    const up = () => { btn.classList.remove('on'); keys[k] = false; };
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => btn.addEventListener(ev, up));
    btn.addEventListener('contextmenu', e => e.preventDefault());
  });

  // ---------------- boot ----------------
  loadLevel(0, false);
  updateButtons();
  if (document.fonts && document.fonts.load) document.fonts.load('8px "Press Start 2P"').catch(() => {});
  let last = performance.now(), acc = 0;
  function frame(t) {
    acc += Math.min(100, t - last); last = t;
    let n = 0;
    while (acc >= 1000 / 60 && n < 5) { step(); acc -= 1000 / 60; n++; }
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  cv.focus();
})();
</script>
